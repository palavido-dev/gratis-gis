# Semgrep configuration for GratisGIS.
#
# CI runs this file only (.github/workflows/semgrep.yml):
#   semgrep scan --config .semgrep.yml --error --metrics=off
#
# The rule matches an untagged template or a string concatenation that
# pastes a value into ST_GeomFromGeoJSON. Prisma.sql and $queryRaw
# tagged templates bind that value, so they are not this pattern.
# Registry packs stay off: a scan with p/javascript on this tree is
# recorded in the coverage ledger when it is run, and it is not the
# CI gate. Do not add a blanket nosemgrep or --disable-nosem.

rules:
  - id: gratisgis-st-geomfromgeojson-tainted-input
    message: |
      ST_GeomFromGeoJSON() is interpolating a value into SQL text.
      Bind it with Prisma.sql or a $n placeholder so the GeoJSON
      text cannot break out of its argument.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: security
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"
      technology: [postgis, postgres, sql]
    pattern-either:
      - patterns:
          - pattern: return `...${$X}...`
          - pattern-regex: 'ST_GeomFromGeoJSON\(\$\{(?!quoteIdent\b)(?!ph\b)'
      - patterns:
          - pattern: $NAME = `...${$X}...`
          - pattern-regex: 'ST_GeomFromGeoJSON\(\$\{(?!quoteIdent\b)(?!ph\b)'
      - patterns:
          - pattern: $ARR.push(`...${$X}...`)
          - pattern-regex: 'ST_GeomFromGeoJSON\(\$\{(?!quoteIdent\b)(?!ph\b)'
      - patterns:
          - pattern: return "..." + $X + "..."
          - pattern-regex: 'ST_GeomFromGeoJSON\('
      - patterns:
          - pattern: $NAME = "..." + $X + "..."
          - pattern-regex: 'ST_GeomFromGeoJSON\('
