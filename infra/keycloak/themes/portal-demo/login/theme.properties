# Public-demo login theme.
#
# Everything visual comes from the `portal` theme; this one adds a
# single panel listing the shared tester accounts on the sign-in
# screen. It exists as a separate theme rather than a flag inside
# `portal` so a real deployment can never show it by accident: an
# operator has to select `portal-demo` as the realm's login theme
# deliberately.
#
# Why it exists at all: the landing page advertises the tester
# credentials in a banner, but /signin redirects straight to Keycloak
# without rendering anything, and Keycloak lives on a different
# hostname. Anyone arriving from a deep link, or who clicks Sign in
# after scrolling past the banner, met a password prompt with nothing
# to type. Over the first two days of request logging, 21 addresses
# reached the sign-in page, 5 clicked through to Keycloak, and none
# completed.

parent=portal
import=common/keycloak

styles=css/login.v2.css css/demo.v3.css
scripts=js/demo-credentials.v3.js
locales=en
