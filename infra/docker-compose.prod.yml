name: gratis-gis-prod

# Production stack for gratisgis.org. Distinct from
# infra/docker-compose.yml (the dev stack) on every axis that matters:
#
#   - No public ports except Caddy on 80/443. Postgres, Keycloak,
#     MinIO, pg_tileserv, and the apps all live on the internal
#     `gratis-net` network and are only reachable through the proxy.
#   - Keycloak runs in production mode (`start --optimized`), not
#     `start-dev`, with a real PostgreSQL store rather than dev-file.
#   - portal-api and portal-web are built from source via the
#     repo-root Dockerfiles. The build context is the repo root so
#     the workspace deps resolve.
#   - All secrets come from infra/.env.prod (gitignored). See
#     infra/.env.prod.example for the required keys.
#   - Caddy holds the only TLS certs; renewal is fully automatic via
#     Let's Encrypt. The certs persist in the caddy-data volume so
#     restarts don't re-fetch.
#
# Day-to-day usage from the box:
#
#   cd /opt/gratis-gis
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build
#   docker compose -f infra/docker-compose.prod.yml logs -f
#
# Or, with the deploy.sh helper:
#   ./infra/deploy.sh

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: gratis-gis-postgres:prod
    container_name: gratis-gis-prod-postgres
    restart: unless-stopped
    # /dev/shm: postgres uses POSIX shared memory for parallel
    # query workers and for ST_AsMVT tile generation. Docker's
    # default is 64 MB, which immediately blows up on PostGIS
    # tile builds over multi-million-row layers (we hit
    # "could not resize shared memory segment ... No space left
    # on device" 500s on /tile/:z/:x/:y.mvt against the 1.4M-row
    # WV parcels test layer). 1 GB is generous for our host
    # (8 GB total) but it's tmpfs so the kernel only commits
    # pages actually written; the cap is the headroom for one
    # tile-build to land on.
    shm_size: 1g
    # pg_partman's background worker schedules
    # partman.run_maintenance() so future observation partitions
    # keep getting created. Load-bearing since the premake-tuning
    # migration reduced premake from 24 to 4: without a scheduler,
    # inserts would start falling into the DEFAULT partition about
    # four months after the last maintenance. Hourly checks are
    # plenty for monthly partitions. The worker connects as the app
    # role to the app database (that role created the extension and
    # owns the partman config).
    #
    # Server tuning. Everything below the partman flags is sized for
    # the demo host (4 vCPU, 7.6 GB RAM, one SSD, Postgres sharing the
    # box with two API replicas, a worker, Keycloak and MinIO) and set
    # 2026-09-03 after the water quality dashboard's aggregates went
    # bimodal. Measured on stock defaults before the change: buffer
    # hit rate 75.7% on a 320 MB database, 22 GB of temp files written
    # in a day by 4 MB work_mem sorts, and a planner on
    # random_page_cost=4 choosing seq scan + external merge sort over
    # an index plan that needs no temp files at all. Flags rather than
    # ALTER SYSTEM so a fresh install gets the same server and the
    # values are reviewed in git. Scale the three memory lines with
    # the host: shared_buffers ~1/8 of RAM on a shared box (1/4 on a
    # dedicated one), effective_cache_size ~1/2, work_mem such that
    # max_connections x work_mem x 3 stays well under RAM.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_partman_bgw,pg_stat_statements
      - -c
      - pg_partman_bgw.interval=3600
      - -c
      - pg_partman_bgw.role=${POSTGRES_USER:-gratisgis}
      - -c
      - pg_partman_bgw.dbname=${POSTGRES_DB:-gratisgis}
      # Memory. The whole database fits in shared_buffers with room
      # to grow, so the engine's collapse-then-filter reads stop
      # paying for disk. work_mem is per sort/hash node per backend;
      # 32 MB lets the relate's hashed key array and the per-scope
      # DISTINCT ON sorts on layers up to ~100k rows stay in memory.
      # maintenance_work_mem was 1 GB, which three autovacuum workers
      # could each claim at once; 512 MB for CREATE INDEX / VACUUM by
      # hand, 128 MB per autovacuum worker.
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - autovacuum_work_mem=128MB
      # Planner. The disk is an SSD: random reads cost about the same
      # as sequential, and the default 4.0 made the planner refuse
      # index scans over 285k-row scopes in favour of seq scan +
      # 110 MB external sort. effective_io_concurrency lets bitmap
      # scans prefetch. JIT compiles every query costed above
      # 100,000, which is exactly the tile and aggregate shapes here,
      # and on 4 cores the compile time was pure overhead on queries
      # that run in a second.
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - jit=off
      # Parallelism. 4 vCPUs: two workers per gather is right, but the
      # default pool of 8 parallel workers lets four heavy queries take
      # every core and starve the API's own connections. Four in total.
      - -c
      - max_parallel_workers=4
      - -c
      - max_parallel_workers_per_gather=2
      # WAL. Bulk imports (a county of parcels is 1.4M observation
      # rows) were forcing a checkpoint every 1 GB; 2 GB halves the
      # checkpoint I/O during a load. zstd compression of full-page
      # writes is cheap on CPU and cuts WAL volume after checkpoints.
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=512MB
      - -c
      - wal_buffers=32MB
      - -c
      - wal_compression=zstd
      # Safety. A single runaway sort must not fill the 76 GB root
      # disk that also holds Docker; the observation partitions are
      # 250 MB, so 4 GB of temp per session is already absurd. A
      # transaction left open by a crashed client holds locks and
      # blocks autovacuum; five minutes is longer than anything the
      # app does deliberately.
      - -c
      - temp_file_limit=4GB
      - -c
      - idle_in_transaction_session_timeout=300000
      # Visibility. track_io_timing makes EXPLAIN (BUFFERS) report
      # real read time and pg_stat_statements carry I/O per query.
      # Temp files over 10 MB and lock waits over deadlock_timeout
      # (1 s) get a log line, which is how the next slow query gets
      # found without a reproduction.
      - -c
      - track_io_timing=on
      - -c
      - log_temp_files=10MB
      - -c
      - log_lock_waits=on
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=5000
      - -c
      - log_min_duration_statement=500
      # Vacuum. The default cost limit throttles autovacuum to a pace
      # meant for spinning disks. A bulk import lands hundreds of
      # thousands of rows in one partition, and until autovacuum has
      # marked those pages all-visible every read of them checks
      # visibility row by row. Five times the budget on an SSD is
      # still gentle and lets it keep up with an import day.
      - -c
      - vacuum_cost_limit=1000
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gratisgis}
      POSTGRES_USER: ${POSTGRES_USER:-gratisgis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.prod}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-prod-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./init-prod-db.sh:/docker-entrypoint-initdb.d/20-init-keycloak-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gratisgis} -d ${POSTGRES_DB:-gratisgis}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gratis-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: gratis-gis-prod-keycloak
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Production mode with realm import on first boot. The realm JSON
    # is materialized by deploy.sh from realm-gratis-gis.prod.json.tmpl
    # via envsubst so hostnames + secrets land in the right shape.
    # --import-realm is a no-op when the realm already exists.
    command:
      - start
      - --http-enabled=true
      - --proxy-headers=xforwarded
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set in .env.prod}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-auth.gratisgis.org}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set in .env.prod}
      # JVM ceiling + Agroal connection-pool hardening. The validation
      # knobs below are what stops the failure mode we hit on
      # 2026-05-09: postgres restarted during a deploy while Keycloak
      # had been up 8 days, and Keycloak kept handing dead JDBC
      # handles out of its pool. The user-visible symptom was admin
      # actions like "send password reset" returning 500 even when
      # the side effect (the email) had already gone out, because
      # Keycloak sends the email first and writes the audit row to
      # EVENT_ENTITY second; the audit insert hit a dead socket and
      # the request rolled back.
      #
      #   background-validation-interval: every 30s a background
      #     thread runs Connection.isValid() on idle connections;
      #     the postgres JDBC driver implements that as a cheap
      #     ping, so dead connections are evicted within ~30s of
      #     postgres coming back up rather than being discovered
      #     one-by-one by failing user requests.
      #   foreground-validation-interval: belt-and-suspenders. If a
      #     connection sat idle longer than 10s, validate before
      #     handing it off. Adds a sub-millisecond ping per checkout
      #     in the worst case.
      #   max-lifetime=30M: recycle every connection at most every
      #     30 min so we never hang on to a truly stale handle even
      #     if validation somehow says it is fine.
      #   idle-removal-interval=5M: shrink the pool to min during
      #     quiet periods so we are not holding 100 hot connections.
      #   acquisition-timeout=5S: fail fast on a saturated pool
      #     instead of letting a request hang.
      #
      # Seconds (S) and minutes (M) are Quarkus duration shorthand.
      # Keys land via JAVA_OPTS_APPEND -D properties because
      # Keycloak 26 does not expose these as KC_DB_* yet.
      JAVA_OPTS_APPEND: >-
        -Xms256m
        -Xmx1024m
        -Dquarkus.datasource.jdbc.background-validation-interval=30S
        -Dquarkus.datasource.jdbc.foreground-validation-interval=10S
        -Dquarkus.datasource.jdbc.acquisition-timeout=5S
        -Dquarkus.datasource.jdbc.idle-removal-interval=5M
        -Dquarkus.datasource.jdbc.max-lifetime=30M
    volumes:
      - ./keycloak/themes/portal:/opt/keycloak/themes/portal:ro
      - ./keycloak/themes/portal-demo:/opt/keycloak/themes/portal-demo:ro
      # Realm-import directory. deploy.sh writes the substituted realm
      # JSON here before bringing keycloak up. Keycloak picks up every
      # *.json on first start when --import-realm is passed.
      - ./keycloak/import:/opt/keycloak/data/import:ro
    # Keycloak 26 serves /health/* on the management interface (port
    # 9000, enabled by KC_HEALTH_ENABLED above), not on the main 8080
    # listener. The image ships neither curl nor wget (and grep is
    # not guaranteed on ubi-micro either), so the probe is bash
    # builtins only, via /dev/tcp redirection (the approach
    # Keycloak's own container guide documents): open a TCP fd to the
    # management port, send a minimal HTTP/1.1 request, read the
    # status line, and pass only on a 200. /health/ready includes the
    # JDBC connection check, so dependents that wait on
    # service_healthy don't boot until Keycloak can actually answer
    # token requests. The $$ is compose interpolation escaping for a
    # literal $.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: 127.0.0.1:9000\r\nConnection: close\r\n\r\n' >&3 &&
          read -r status <&3 &&
          case "$$status" in *' 200 '*) exit 0;; *) exit 1;; esac
      interval: 10s
      timeout: 5s
      retries: 10
      # First boot with --import-realm parses and imports the whole
      # realm JSON; give it a generous grace window before failures
      # start counting.
      start_period: 120s
    # JVM ceiling is -Xmx1024m above; the cgroup limit adds headroom
    # for metaspace, thread stacks, and native buffers on top of the
    # heap. See the memory-budget comment on portal-api below for the
    # host-wide arithmetic.
    mem_limit: 1536m
    networks:
      - gratis-net

  minio:
    # Pin a recent MinIO. Earlier 2024 releases reject the
    # x-amz-sdk-checksum-algorithm header that AWS SDK v3 sends by
    # default on PUT / CreateBucket, with "A header you provided
    # implies functionality that is not implemented". The April 2025
    # release we used initially also rejected the same header on
    # PUT-Bucket-CORS / PUT-Bucket-Policy specifically (admin
    # operations send the header but the surface there hadn't caught
    # up). The September 2025 release accepts it everywhere we use,
    # so bucket bootstrap (HeadBucket / PutBucketPolicy /
    # PutBucketCors) and presigned PUTs both succeed without the
    # WHEN_REQUIRED opt-out alone needing to do all the work.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: gratis-gis-prod-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env.prod}
      # Server-level CORS allowlist. Mirrors the per-bucket CORS rule
      # the api would otherwise install via PutBucketCorsCommand --
      # but that command path triggers MinIO's "header you provided
      # implies functionality not implemented" rejection on every
      # MinIO release we've tried (server flips between accepting
      # and rejecting x-amz-sdk-checksum-algorithm headers across
      # releases). Setting it on the server side sidesteps the
      # per-bucket dance entirely. Leave the bucket-policy install
      # in the api alone -- it works -- this only replaces the CORS
      # piece. Multiple origins go in as a comma-separated list.
      MINIO_API_CORS_ALLOW_ORIGIN: ${PUBLIC_URL:-https://gratisgis.org}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gratis-net

  pg_tileserv:
    # TODO(pinning): `latest` is the only tag we have evidence for in
    # this repo, and floating tags turn upstream releases into
    # unreviewed deploys (see the node:25 note in the app
    # Dockerfiles). At the next deploy, capture the digest the box is
    # actually running with
    #   docker inspect --format '{{index .RepoDigests 0}}' gratis-gis-prod-pg_tileserv
    # and pin it here as pramsey/pg_tileserv@sha256:<digest>. Do not
    # guess a version tag.
    image: pramsey/pg_tileserv:latest
    container_name: gratis-gis-prod-pg_tileserv
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gratisgis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gratisgis}
    networks:
      - gratis-net

  # One-shot migration runner. Runs `prisma migrate deploy` against the
  # production database, then exits. Other services depend_on this with
  # `service_completed_successfully` so a fresh deploy applies pending
  # migrations EXACTLY once (not N times across api replicas + worker).
  # The image is shared with portal-api/portal-worker so we don't carry
  # an extra build target.
  portal-migrate:
    image: gratis-gis/portal-api:latest
    container_name: gratis-gis-prod-portal-migrate
    build:
      context: ..
      dockerfile: apps/portal-api/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gratisgis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gratisgis}
    # Run prisma migrate deploy and exit. Idempotent: a current DB
    # no-ops in seconds. The container will be in `exited` state
    # afterwards, which is what `service_completed_successfully` waits
    # for.
    entrypoint: ["/usr/bin/tini", "--"]
    command:
      - sh
      - -c
      - >
        /app/node_modules/.bin/prisma generate --schema=/app/prisma/schema.prisma &&
        /app/node_modules/.bin/prisma migrate deploy --schema=/app/prisma/schema.prisma
    networks:
      - gratis-net

  portal-api:
    image: gratis-gis/portal-api:latest
    # NOTE: container_name removed so docker compose can spawn N
    # replicas (otherwise compose errors out about a name conflict).
    # Cron leader-election is handled inside the process via PG
    # advisory lock; whichever replica acquires the lock first runs
    # the @Cron handlers (BackupCronService, NotificationsWorker
    # tick, etc.). Followers keep all HTTP routes mapped but skip
    # cron side effects.
    build:
      context: ..
      dockerfile: apps/portal-api/Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 2
    # Memory budget for the 7.6 GiB (8 GB nominal) prod box. Two
    # things are capped per service: the V8 old-space ceiling
    # (NODE_OPTIONS) and the cgroup limit (mem_limit, heap plus
    # native memory such as GDAL and buffers, set ~512 MiB above the
    # heap cap).
    #
    #   heap ceilings:   api 2 x 2048 + worker 3072      = 7168 MiB
    #   cgroup limits:   api 2 x 2560 + worker 3584
    #                    + pointcloud 2560 + keycloak 1536
    #                    + chromium 2 x 1024              = 13824 MiB
    #
    # The limits deliberately oversubscribe the box: they are
    # runaway caps, not reservations. Steady-state usage is a small
    # fraction of the caps, and the heavy consumers peak at
    # different times (ingest in portal-worker, prints in the
    # chromium sidecars). What the caps buy is that a runaway
    # container gets OOM-killed inside its own cgroup (and
    # `restart: unless-stopped` brings it back) instead of the
    # kernel's global OOM killer shooting postgres. Postgres and the
    # OS are left uncapped on purpose; they are the last things that
    # should die. Operators on bigger boxes: raise NODE_OPTIONS and
    # mem_limit together, keeping the ~512 MiB native headroom.
    mem_limit: 2560m
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        # Wait for /health/ready, not just process start: the api
        # fetches the realm JWKS at boot, and racing a still-booting
        # Keycloak turns into auth 500s until the retry.
        condition: service_healthy
      minio:
        condition: service_started
      portal-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Old-space ceiling for request-scale work. The county-scale
      # GDAL ingest path that once needed 4 GiB here (observed
      # 2026-05-09) now runs in portal-worker, which carries the
      # larger heap below; the api replicas only need room for
      # request handling plus moderate synchronous imports. Two
      # replicas at 4096 each plus the worker's 4096 added up to
      # ~12 GiB of allowed heap on a 7.6 GiB box, which is how a
      # busy day could OOM the host. Streaming ingest in batches
      # (#103) remains the real fix for the memory shape.
      NODE_OPTIONS: --max-old-space-size=2048
      # Migrations are owned by the portal-migrate one-shot. Skip on
      # every long-lived process so N replicas + the worker don't all
      # take the migration lock at boot.
      SKIP_MIGRATE: "true"
      # Staging dir lives on a shared docker volume mounted in api +
      # portal-worker. Without this, the worker can't read files the
      # api wrote at /ingest/stage time (different container tmpfs).
      STAGING_DIR: /var/lib/gg-staging
      DATABASE_URL: postgresql://${POSTGRES_USER:-gratisgis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gratisgis}
      # Token issuer side: KEYCLOAK_URL is the public-facing Keycloak
      # base, used both as the JWT issuer prefix and as the JWKS
      # fetch root. The api code reads this via process.env.KEYCLOAK_URL
      # in src/auth/jwt.strategy.ts.
      KEYCLOAK_URL: https://${AUTH_DOMAIN:-auth.gratisgis.org}
      # KEYCLOAK_INTERNAL_URL is the docker-network address portal-api
      # uses for server-to-server admin REST calls (KeycloakAdminService).
      # The public KEYCLOAK_URL has `/admin/*` blocked at the Caddy
      # edge for defense in depth; we route admin REST through the
      # internal hostname to bypass that block since the request never
      # leaves the docker network.  Issuer + JWKS lookups stay on the
      # public URL because the JWT iss claim is the public hostname.
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-gratis-gis}
      # Service-account credentials for the api's admin operations
      # (user reconcile, password reset, role mutation). Matches the
      # portal-api-admin client in the realm import.
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-portal-api-admin}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET must be set in .env.prod}
      # AES-256-GCM master key for credential-at-rest encryption.
      # Used for stored item credentials (#36) and the SMTP password
      # in admin Notifications. Generate with:
      #   openssl rand -base64 32
      # If this is rotated after-the-fact, every encrypted row in
      # item_credential and system_setting becomes unreadable -- treat
      # it as effectively immutable once set.
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY must be set in .env.prod}
      # MinIO / S3. Variable names match what storage.service.ts /
      # backup.service.ts read; no S3_* aliases.
      #
      # The endpoint has to be the PUBLIC hostname because the S3
      # SDK bakes it into presigned URLs and signature v4 covers the
      # Host header. The api hairpins back through Caddy for the
      # admin-style operations (HeadBucket, PutBucketPolicy,
      # PutBucketCors), which is fine: those run at boot, not per
      # request. Per-request work (presigning) is just URL
      # manipulation in-process and never round-trips to MinIO.
      MINIO_ENDPOINT: https://${STORAGE_DOMAIN:-storage.gratisgis.org}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${S3_BUCKET:-gratisgis}
      # Browser-facing MinIO base. Same hostname as MINIO_ENDPOINT,
      # both because there's no CDN in front and because the
      # presigned URLs we hand back ARE built off this. Saving
      # publicUrl as a relative MINIO_PUBLIC_BASE here would just
      # duplicate the host the SDK already embedded.
      MINIO_PUBLIC_BASE: https://${STORAGE_DOMAIN:-storage.gratisgis.org}
      # Origins the browser is allowed to PUT from. The bucket CORS
      # rule we install at boot opens this list. Keep it tight: only
      # the portal-web origin (apex) needs cross-origin access.
      STORAGE_ALLOWED_ORIGINS: ${PUBLIC_URL:-https://gratisgis.org}
      # Backup archives. The runtime image pre-creates this with
      # app:app ownership so the named volume below inherits it.
      BACKUP_DIR: /app/backups
      # How many successful archives to keep. MUST be passed through
      # explicitly: --env-file only populates variables for
      # interpolation in THIS file, it does not put them in the
      # container's environment, so setting it in .env.prod alone is
      # inert. (Same class of mistake as an env var missing from
      # turbo.json's task env: set in one place, never reaching the
      # process that reads it.)
      #
      # Retention is the durable knob rather than the admin UI's,
      # because the UI writes a backup_config row and the nightly
      # golden reset drops and restores the whole database, reverting
      # it every morning.
      #
      # Sizing note: an archive is roughly a second copy of the object
      # store and compression buys little on imagery, so budget
      # retention x bucket size, not retention x what old archives
      # used to be.
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-7}
      # Public URL for redirects + OG metadata.
      PUBLIC_URL: ${PUBLIC_URL:-https://gratisgis.org}
      # #159 Phase 2: WebSocket endpoints of the chromium sidecars.
      # Comma-separated; the render service picks one at random
      # for load balancing. Token gates access so only the API can
      # reach the browser endpoints (the sidecars are on the
      # internal network but defense-in-depth).
      CHROMIUM_WS_ENDPOINTS: ws://chromium-1:3000?token=${CHROMIUM_TOKEN:?CHROMIUM_TOKEN must be set in .env.prod},ws://chromium-2:3000?token=${CHROMIUM_TOKEN}
      # Internal URL portal-api hands to the chromium sidecar so
      # the browser navigates to the print-preview route from
      # within the docker network rather than hairpin through
      # the public domain.
      PRINT_PREVIEW_BASE_URL: http://portal-web:3000
      # #184 workbench: which analysis capability tiers this
      # deployment offers. The pointcloud-worker service below
      # executes the server-heavy tier; operators on small boxes
      # remove that service AND this value together, and the API
      # then refuses derive requests with a plain 503 instead of
      # queueing jobs nothing will run. The install doctor reports
      # whether the hardware honestly supports each tier.
      ANALYSIS_TIERS: server-heavy
      # Operator tuning knobs for the up-front cost models (#205
      # merge, #199 mosaic, #208 grid). Same discovery as on the
      # worker: documented as env-tunable but never passed through
      # compose, so only code defaults ever applied. Empty values
      # fall back to the code defaults (envNum tolerates junk).
      MERGE_TIMEOUT_SEC: ${MERGE_TIMEOUT_SEC:-}
      MERGE_DOWNLOAD_MIB_PER_SEC: ${MERGE_DOWNLOAD_MIB_PER_SEC:-}
      MERGE_UNTWINE_SEC_PER_GIB: ${MERGE_UNTWINE_SEC_PER_GIB:-}
      MERGE_PER_TILE_OVERHEAD_SEC: ${MERGE_PER_TILE_OVERHEAD_SEC:-}
      MERGE_TIME_CEILING_SEC: ${MERGE_TIME_CEILING_SEC:-}
      MOSAIC_TIMEOUT_SEC: ${MOSAIC_TIMEOUT_SEC:-}
      MOSAIC_DOWNLOAD_MIB_PER_SEC: ${MOSAIC_DOWNLOAD_MIB_PER_SEC:-}
      MOSAIC_GDAL_SEC_PER_GIB: ${MOSAIC_GDAL_SEC_PER_GIB:-}
      MOSAIC_PER_TILE_OVERHEAD_SEC: ${MOSAIC_PER_TILE_OVERHEAD_SEC:-}
      MOSAIC_TIME_CEILING_SEC: ${MOSAIC_TIME_CEILING_SEC:-}
      GRID_DOWNLOAD_MIB_PER_SEC: ${GRID_DOWNLOAD_MIB_PER_SEC:-}
      GRID_SEC_PER_MILLION_POINTS: ${GRID_SEC_PER_MILLION_POINTS:-}
      GRID_SEC_PER_MILLION_CELLS: ${GRID_SEC_PER_MILLION_CELLS:-}
      GRID_PER_CHUNK_OVERHEAD_SEC: ${GRID_PER_CHUNK_OVERHEAD_SEC:-}
      GRID_CHUNK_CELLS: ${GRID_CHUNK_CELLS:-}
      GRID_TIME_CEILING_SEC: ${GRID_TIME_CEILING_SEC:-}
      # Deployed ref for /api/portal-info (QGIS plugin discovery and
      # support conversations). Stamped by deploy.sh from git describe.
      GG_VERSION: ${GG_VERSION:-}
      # Public origin, used to build links in outbound email. This was
      # never passed through, and the code defaults to
      # http://localhost:3000, so every notification email this portal
      # has sent carried a link pointing at the recipient's own
      # machine. Derived from PORTAL_DOMAIN so there is one place to
      # set the portal's address.
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-https://${PORTAL_DOMAIN:-gratisgis.org}}
      # In-portal feedback (#146). Off unless set: enabling it opens a
      # public, unauthenticated POST endpoint and shows a feedback
      # button to every visitor, which is right for the demo and wrong
      # for a private deployment.
      PORTAL_FEEDBACK_ENABLED: ${PORTAL_FEEDBACK_ENABLED:-}
      # Scripts (#221). Off unless set.
      #
      # This line was missing until 2026-08-09, and its absence meant the
      # documented way to enable scripts did nothing at all: the variable
      # was named in a comment further down this file, referenced by the
      # docs, and never passed to a single service. Setting it in
      # .env.prod left /portal-info reporting `scripts: false` with no
      # indication why. Found by setting it and watching nothing happen.
      PORTAL_SCRIPTS_ENABLED: ${PORTAL_SCRIPTS_ENABLED:-}
      # Notification address. Submissions persist regardless; this only
      # decides whether an email goes out. Note this was never passed
      # through before, which is why the old code path silently fell
      # back to the upstream maintainer's inbox.
      FEEDBACK_RECIPIENT_EMAIL: ${FEEDBACK_RECIPIENT_EMAIL:-${ACME_EMAIL:-}}
      # Salt for the one-way hash of reporter IPs, which is all that is
      # stored. Unset means a per-process random salt, so the rate
      # limit resets on restart and the two replicas count separately.
      FEEDBACK_IP_SALT: ${FEEDBACK_IP_SALT:-}
    volumes:
      - portal-api-backups:/app/backups
      - gg-staging:/var/lib/gg-staging
    networks:
      - gratis-net
      # #221: also reachable from the script network, because a script
      # talking to the portal's public API is the entire supported way
      # for it to do anything. postgres, minio, and keycloak
      # deliberately do NOT join that network; this is the one door,
      # and it is the same authenticated HTTP surface any client uses.
      - gg-script-net
    # No public port. Caddy talks to it as `portal-api:4000` and load-
    # balances across replicas via Docker DNS round-robin.

  # Async-import worker. Same image as portal-api, different CMD:
  # bootstraps a Nest standalone application context that loads only
  # ImportJobsWorkerModule -- no HTTP listener, just the polling loop
  # that drains the import_job table. CPU-bound import work runs here
  # so the api never blocks on a county-scale parcel ingest.
  #
  # SELECT FOR UPDATE SKIP LOCKED in ImportJobsService.claimNext()
  # makes N>1 worker replicas safe; today we keep replicas=1 because
  # one worker per host is plenty for the dataset volumes we see, and
  # parallel COPY against the same observation table competes for the
  # GIN attrs pending list flushes anyway.
  portal-worker:
    image: gratis-gis/portal-api:latest
    container_name: gratis-gis-prod-portal-worker
    build:
      context: ..
      dockerfile: apps/portal-api/Dockerfile
    restart: unless-stopped
    # See the memory-budget comment on portal-api. The worker gets
    # the biggest heap because the county-scale ingest path (whole
    # FeatureCollection in memory before insertFeatures) runs here;
    # 3 GiB covers roughly 2M polygon features. Streaming ingest in
    # batches (#103) is the real fix.
    mem_limit: 3584m
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_started
      portal-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=3072
      SKIP_MIGRATE: "true"
      STAGING_DIR: /var/lib/gg-staging
      # The worker never runs the cron leader-election lock because
      # nothing in ImportJobsWorkerModule is @Cron-driven; the import
      # poll loop is plain setInterval. ENABLE_CRONS=false keeps the
      # leader-election service from acquiring an extra connection it
      # doesn't need.
      ENABLE_CRONS: "false"
      # worker.main.ts gates the script claimer on this. Missing here for
      # the same reason it was missing on portal-api: it was documented
      # and never wired.
      PORTAL_SCRIPTS_ENABLED: ${PORTAL_SCRIPTS_ENABLED:-}
      # Cap the Prisma pool below the API default (25). The worker does
      # not serve tiles, so it does not need a wide pool, and this keeps
      # total DB demand (portal-api 2x25 + this + script-runner +
      # Keycloak) inside postgres max_connections=100.
      DB_POOL_MAX: "8"
      DATABASE_URL: postgresql://${POSTGRES_USER:-gratisgis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gratisgis}
      KEYCLOAK_URL: https://${AUTH_DOMAIN:-auth.gratisgis.org}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-gratis-gis}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-portal-api-admin}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET must be set in .env.prod}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY must be set in .env.prod}
      MINIO_ENDPOINT: https://${STORAGE_DOMAIN:-storage.gratisgis.org}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${S3_BUCKET:-gratisgis}
      MINIO_PUBLIC_BASE: https://${STORAGE_DOMAIN:-storage.gratisgis.org}
      PUBLIC_URL: ${PUBLIC_URL:-https://gratisgis.org}
      # Same image as portal-api, so it carries the same email-link
      # code path. Set here too rather than relying on the worker never
      # sending mail, which is true today and easy to break.
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-https://${PORTAL_DOMAIN:-gratisgis.org}}
    volumes:
      - gg-staging:/var/lib/gg-staging

    # Override CMD: same image but boot the worker entry point instead
    # of the http server.
    command: ["node", "dist/worker.main.js"]
    # The slim node base image doesn't ship procps, so `pgrep`
    # isn't available. Use a /proc shell test instead: container
    # PID 1 is the worker after tini exec's it; if /proc/1 has the
    # right cmdline it's alive. (If the worker process dies, the
    # container itself exits and `restart: unless-stopped` brings
    # it right back -- this healthcheck is mostly belt-and-
    # suspenders.)
    healthcheck:
      test: ["CMD-SHELL", "grep -q worker.main.js /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - gratis-net

  # #221: claims queued script runs and hands them to the executor.
  #
  # Behind the `scripts` profile, so a plain `docker compose up` does
  # not start it. Running code the portal did not write should be a
  # deliberate decision, not something inherited from an upgrade.
  # Start with `--profile scripts` and set PORTAL_SCRIPTS_ENABLED=1 so
  # the API offers the run endpoints.
  #
  # This container holds the database handle and NO Python. It sits on
  # both networks because it needs postgres to claim work and the
  # executor to dispatch it. That dual membership is precisely why the
  # Python lives somewhere else.
  script-runner:
    image: gratis-gis/portal-api:latest
    container_name: gratis-gis-prod-script-runner
    profiles: ["scripts"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      portal-migrate:
        condition: service_completed_successfully
    mem_limit: 512m
    environment:
      NODE_ENV: production
      # Never migrate from here: portal-migrate owns that, and a
      # third writer racing it is how half-applied migrations happen.
      SKIP_MIGRATE: "true"
      ENABLE_CRONS: "false"
      # The claimer's own off switch. script-worker.main.ts checks this
      # before it starts polling; without it here, a queued run would be
      # executed even with the feature turned off everywhere else.
      PORTAL_SCRIPTS_ENABLED: ${PORTAL_SCRIPTS_ENABLED:-}
      # Small Prisma pool: the script claimer is a light poll loop. See
      # the portal-worker note above on the shared max_connections budget.
      DB_POOL_MAX: "4"
      DATABASE_URL: postgresql://${POSTGRES_USER:-gratisgis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gratisgis}
      SCRIPT_EXECUTOR_URL: http://script-executor:4100
      SCRIPT_EXECUTOR_TOKEN: ${SCRIPT_EXECUTOR_TOKEN:?SCRIPT_EXECUTOR_TOKEN must be set in .env.prod when the scripts profile is used}
      SCRIPT_TIMEOUT_SECONDS: ${SCRIPT_TIMEOUT_SECONDS:-300}
      SCRIPT_POLL_MS: ${SCRIPT_POLL_MS:-3000}
      SCRIPT_MAX_LOG_BYTES: ${SCRIPT_MAX_LOG_BYTES:-262144}
    command: ["node", "dist/script-worker.main.js"]
    healthcheck:
      test: ["CMD-SHELL", "grep -q script-worker.main.js /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - gratis-net
      - gg-script-net

  # #221: the one container that runs user-authored Python.
  #
  # No DATABASE_URL, no MinIO keys, no Keycloak secret, and crucially
  # only on gg-script-net, which does not carry postgres, minio, or
  # keycloak. A script cannot open a socket to them, rather than being
  # able to open one and merely lacking a password.
  #
  # Its own image because it needs a Python interpreter and a
  # scientific stack that no other service wants.
  script-executor:
    image: gratis-gis/script-runner:latest
    container_name: gratis-gis-prod-script-executor
    profiles: ["scripts"]
    build:
      context: ..
      dockerfile: infra/script-runner/Dockerfile
      args:
        PORTAL_API_IMAGE: gratis-gis/portal-api:latest
    restart: unless-stopped
    # Deliberately modest. A maintenance script needing more than this
    # is doing work the analysis tier should be doing.
    mem_limit: 1024m
    # Measured gap, not a precaution: before this the container had no
    # CPU quota at all, so a `while True: pass` pegged every core on
    # the box for the whole timeout. Two cores leaves the API, the
    # database, and the import queue responsive while a script misbehaves.
    cpus: 2.0
    # A fork bomb otherwise gets ~9000 processes. 256 is generous for
    # anything a maintenance script legitimately does.
    pids_limit: 256
    # Scratch space for a run, as RAM rather than disk.
    #
    # Also a measured gap. CPU, memory, and processes were all capped
    # while writes were not, so a script could `open('x','w')` in a loop
    # and fill the host's root filesystem, which takes down postgres,
    # the API, and the site along with it. Probed on prod: 27 GiB free
    # and no quota in the way.
    #
    # tmpfs rather than a disk quota because a tmpfs is counted against
    # this container's own memory cgroup. That collapses two limits into
    # one honest number: a run gets 1 GB total across memory and
    # scratch, and exceeding it kills the run rather than the machine.
    # A disk quota would need a specific storage driver and would still
    # leave the two budgets independent.
    #
    # mode 0711 matches what the Dockerfile creates: root-owned, so the
    # executor can make each run's directory, traversable so the script
    # user can enter the one directory it is handed without being able
    # to list the parent and see other runs.
    # Read-only root, with a bounded tmpfs for every path a run can
    # write. Before this, only /var/tmp/ggscript was capped; the rest of
    # the container root was writable overlay on the HOST disk with no
    # quota, and TMPDIR was unset so Python's tempfile wrote to /tmp
    # there. A `open('/tmp/x','wb')` loop filled the host filesystem and
    # took the site down. Now the root is read-only and the only
    # writable places are these tmpfs mounts, all charged to this
    # container's 1 GB memory cgroup, so overrunning them kills the run
    # rather than the machine. The executor's childEnv points HOME and
    # TMPDIR at the per-run dir under /var/tmp/ggscript.
    read_only: true
    tmpfs:
      - /var/tmp/ggscript:size=256m,mode=0711,uid=0,gid=0
      # Safety net for anything that ignores TMPDIR and hardcodes /tmp.
      - /tmp:size=32m,mode=1777
    # Root INSIDE the container, and nothing else. The executor needs
    # to change user when it spawns a script (an unprivileged parent
    # cannot), and CAP_KILL so it can SIGKILL a script's orphaned
    # processes across the uid boundary after a run (a script can escape
    # the process-group kill with os.setsid; the executor sweeps every
    # process left owned by the script uid). Nothing else. Dropping every
    # other capability plus no-new-privileges makes "root" here mean
    # almost nothing.
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - KILL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      SKIP_MIGRATE: "true"
      ENABLE_CRONS: "false"
      # Shared secret with the claimer. Network placement is the
      # primary control; this is the backstop for the day something
      # else lands on gg-script-net.
      SCRIPT_EXECUTOR_TOKEN: ${SCRIPT_EXECUTOR_TOKEN:?SCRIPT_EXECUTOR_TOKEN must be set in .env.prod when the scripts profile is used}
      SCRIPT_EXECUTOR_PORT: "4100"
      # Where a script's own API calls go. Internal DNS rather than the
      # public hostname so a run does not leave the host, hairpin
      # through Caddy, and pay TLS to reach a container beside it.
      PORTAL_BASE_URL: http://portal-api:4000
    # Bypass the shared entrypoint. It requires DATABASE_URL and runs
    # `prisma generate`, both of which assume every container talks to
    # the database; this one deliberately does not, and refusing to
    # start without a credential it must not have would be exactly
    # backwards.
    #
    # tini is kept. It is the reason this line is not simply removed:
    # this process spawns Python children, and without an init to reap
    # them a killed script leaves a zombie behind every run.
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["node", "dist/script-executor.main.js"]
    # No published port. Reachable only from inside gg-script-net.
    healthcheck:
      test: ["CMD-SHELL", "grep -q script-executor.main.js /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      gg-script-net:
        # Static address so the egress fence never points at a stale IP.
        # Must sit inside the pinned subnet and outside the range Docker
        # hands out dynamically to the other members.
        ipv4_address: 172.19.0.10

  # #184 workbench: server-heavy analysis tier. PDAL + untwine +
  # GDAL from conda-forge in a dedicated image so the Node images
  # stay lean; a Python runner polls the analysis_job table with
  # FOR UPDATE SKIP LOCKED and executes primitive chains (hillshade
  # in v1, the #182 merge pipeline next). Operators on small boxes
  # delete this service together with the ANALYSIS_TIERS value on
  # portal-api; the API then refuses derive requests with a plain
  # 503. Uses the INTERNAL MinIO endpoint: the worker never mints
  # presigned URLs, so there is no reason to hairpin through Caddy.
  pointcloud-worker:
    image: gratis-gis/pointcloud-worker:latest
    container_name: gratis-gis-prod-pointcloud-worker
    build:
      context: ..
      dockerfile: tools/pointcloud-worker/Dockerfile
    restart: unless-stopped
    # See the memory-budget comment on portal-api. PDAL and untwine
    # allocate native memory (no V8 heap flag applies); the cgroup
    # cap keeps a pathological point cloud from squeezing postgres.
    mem_limit: 2560m
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      portal-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gratisgis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gratisgis}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${S3_BUCKET:-gratisgis}
      SCRATCH_DIR: /scratch
      # Operator tuning knobs (#205 / #199 / #208). These were
      # documented as env-tunable but never passed through compose,
      # so only the code defaults ever applied; discovered when the
      # first chunked Elkins build needed a smaller GRID_CHUNK_CELLS
      # than the default and the .env.prod override silently did
      # nothing. Empty values fall back to the code defaults.
      ANALYSIS_TIMEOUT_SEC: ${ANALYSIS_TIMEOUT_SEC:-}
      MERGE_TIMEOUT_SEC: ${MERGE_TIMEOUT_SEC:-}
      MERGE_SCRATCH_FACTOR: ${MERGE_SCRATCH_FACTOR:-}
      MERGE_MIN_FREE_GB: ${MERGE_MIN_FREE_GB:-}
      MOSAIC_TIMEOUT_SEC: ${MOSAIC_TIMEOUT_SEC:-}
      MOSAIC_SCRATCH_FACTOR: ${MOSAIC_SCRATCH_FACTOR:-}
      GRID_CHUNK_CELLS: ${GRID_CHUNK_CELLS:-}
      GRID_CHUNK_BUFFER_CELLS: ${GRID_CHUNK_BUFFER_CELLS:-}
      GRID_MAX_CHUNKS: ${GRID_MAX_CHUNKS:-}
    volumes:
      - pointcloud-scratch:/scratch
    networks:
      - gratis-net

  portal-web:
    image: gratis-gis/portal-web:latest
    container_name: gratis-gis-prod-portal-web
    build:
      context: ..
      dockerfile: apps/portal-web/Dockerfile
      args:
        # #274: NEXT_PUBLIC_* vars must be present at build time so
        # Next.js inlines them into the client bundle. Setting these
        # only in `environment:` below would not reach the static
        # output that the standalone server serves.
        # Defaults to "1" for the canonical gratisgis.org deploy so
        # the open-source project section renders below the Hero. A
        # per-tenant fork can pass PROJECT_LANDING= in .env.prod (or
        # explicitly export PROJECT_LANDING=0) to suppress it.
        NEXT_PUBLIC_PROJECT_LANDING: ${PROJECT_LANDING:-1}
        NEXT_PUBLIC_GITHUB_REPO: ${GITHUB_REPO:-palavido-dev/gratis-gis}
        # #141: when set to "1", the landing page renders the
        # public-testing banner (three documented test credentials +
        # daily-reset notice).  Pairs with the gg-reset-demo.timer
        # systemd unit on the host.  Defaults to "" so a per-tenant
        # fork doesn't accidentally advertise demo accounts.
        NEXT_PUBLIC_PUBLIC_TESTING: ${PUBLIC_TESTING:-}
        # Version badge (landing footer + user menu). deploy.sh and
        # install.sh export GG_VERSION from git describe; a manual
        # compose build without it renders "dev" in the UI, which is
        # honest for an unscripted build.
        NEXT_PUBLIC_GG_VERSION: ${GG_VERSION:-}
    restart: unless-stopped
    depends_on:
      portal-api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Server-side fetch target. apps/portal-web/src/lib/api.ts and
      # the BFF route handler both read PORTAL_API_URL when running
      # on the server. Hits the api over the internal docker network
      # (no TLS hop, no Caddy round-trip).
      PORTAL_API_URL: http://portal-api:4000
      # Browser-side fetch target. Routed through Caddy under /api/.
      NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-https://gratisgis.org}
      # NextAuth: must match the public Keycloak issuer so iss claim
      # validates. NEXTAUTH_URL is the canonical public app URL.
      NEXTAUTH_URL: ${PUBLIC_URL:-https://gratisgis.org}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set in .env.prod}
      # The web's auth.ts builds the issuer from KEYCLOAK_URL +
      # KEYCLOAK_REALM (it is not the same as the api's
      # KEYCLOAK_ISSUER variable). Public URL on purpose -- the JWT
      # iss claim has to match this for token validation to work,
      # and the discovery doc fetch runs from the container out
      # through the public DNS hairpin.
      KEYCLOAK_URL: https://${AUTH_DOMAIN:-auth.gratisgis.org}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-gratis-gis}
      # Carried for compat with anything else that reads it.
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://auth.gratisgis.org/realms/gratis-gis}
      # NextAuth's Keycloak provider reads these names verbatim
      # (apps/portal-web/src/lib/auth.ts). portal-web is a public
      # client with PKCE in the realm; the secret here is the empty
      # string but we still need the env var present for the provider
      # to register.
      KEYCLOAK_CLIENT_ID_WEB: ${KEYCLOAK_CLIENT_ID:-portal-web}
      KEYCLOAK_CLIENT_SECRET_WEB: ${KEYCLOAK_CLIENT_SECRET:-}
    networks:
      - gratis-net

  # #159 Phase 2: headless Chrome sidecars for server-side print
  # rendering. Two replicas so concurrent print jobs don't queue.
  # portal-api connects via WebSocket on chromium:3000; nothing is
  # exposed to the public network. Each sidecar is capped at 1 GB
  # RSS so a runaway render can't take the host down.
  chromium-1:
    # TODO(pinning): no version evidence exists in this repo for the
    # browserless image. At the next deploy, capture the running
    # digest with
    #   docker inspect --format '{{index .RepoDigests 0}}' gratis-gis-prod-chromium-1
    # and pin BOTH chromium services to
    # ghcr.io/browserless/chromium@sha256:<digest> together. Do not
    # guess a version tag.
    image: ghcr.io/browserless/chromium:latest
    container_name: gratis-gis-prod-chromium-1
    restart: unless-stopped
    networks:
      - gratis-net
    environment:
      TOKEN: ${CHROMIUM_TOKEN:?CHROMIUM_TOKEN must be set in .env.prod}
      CONCURRENT: "3"
      TIMEOUT: "30000"
    mem_limit: 1g
    cap_add:
      - SYS_ADMIN

  chromium-2:
    # TODO(pinning): pin to the same digest as chromium-1; see the
    # note there.
    image: ghcr.io/browserless/chromium:latest
    container_name: gratis-gis-prod-chromium-2
    restart: unless-stopped
    networks:
      - gratis-net
    environment:
      TOKEN: ${CHROMIUM_TOKEN:?CHROMIUM_TOKEN must be set in .env.prod}
      CONCURRENT: "3"
      TIMEOUT: "30000"
    mem_limit: 1g
    cap_add:
      - SYS_ADMIN

  caddy:
    # Pinned to the exact minor rather than the floating 2-alpine
    # tag, so a Caddy major/minor bump is a reviewed change instead
    # of a surprise on the next pull (same rationale as the node
    # pins in the app Dockerfiles). Patch releases within 2.10 still
    # float; capture a digest here if that ever bites.
    image: caddy:2.10-alpine
    container_name: gratis-gis-prod-caddy
    restart: unless-stopped
    depends_on:
      portal-web:
        condition: service_started
      keycloak:
        # Don't serve the auth vhost until Keycloak can actually
        # answer; avoids a window of 502s on {$AUTH_DOMAIN} during
        # cold boots.
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Surfaced as {$PORTAL_DOMAIN} / {$AUTH_DOMAIN} in the Caddyfile so
      # we can reuse the same file in staging if we ever want.
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-gratisgis.org}
      AUTH_DOMAIN: ${AUTH_DOMAIN:-auth.gratisgis.org}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN:-storage.gratisgis.org}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set in .env.prod}
      # Basic auth for the /_stats analytics dashboard. The default
      # hash is deliberately unusable: it was generated from 33 random
      # bytes that were never written down, so nobody can sign in with
      # it and a deployment that ignores /_stats is closed rather than
      # carrying a published password. A default is still required,
      # because Caddy refuses to start on an undecodable one and it
      # takes the whole site with it. To use the dashboard, set both
      # values in .env.prod:
      #   docker run --rm caddy caddy hash-password --plaintext '...'
      # and single-quote the hash there so nothing expands the $ signs.
      STATS_USER: ${STATS_USER:-stats}
      STATS_HASH: ${STATS_HASH:-$$2a$$14$$h.JUdPIZywlDk54gHFpKa..58uz7UVWNW/NvgJw4kC8ziYgQwGC4K}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # Access logs Caddy writes and the rendered dashboard it serves.
      # Defaults match the collector's own default store
      # (GG_ANALYTICS_DIR in infra/analytics/collect.py) so a fresh
      # deployment lines up without setting anything; prod points both
      # at the data volume in .env.prod.
      - ${CADDY_LOG_DIR:-/var/lib/gg-analytics/caddy-logs}:/var/log/caddy
      - ${ANALYTICS_DIR:-/var/lib/gg-analytics}:/var/analytics:ro
    networks:
      - gratis-net

volumes:
  pgdata:
  miniodata:
  caddy-data:
  caddy-config:
  portal-api-backups:
  # Shared staging dir between portal-api (writer at /ingest/stage)
  # and portal-worker (reader at runJob). Without this, files staged
  # by the api would not be visible to the worker.
  gg-staging:
  # #184: scratch space for the pointcloud-worker's downloads and
  # intermediate rasters. A named volume so a mid-job crash doesn't
  # bloat the container layer; the runner cleans per-job subdirs.
  pointcloud-scratch:

networks:
  gratis-net:
    driver: bridge

  # #221: the network user-authored Python is allowed to see.
  #
  # Members: script-executor (which runs the Python), script-runner
  # (which hands it work), and portal-api (which the script talks to).
  # NOT postgres, NOT minio, NOT keycloak. That absence is the control.
  #
  # Measured before it existed: a probe script on the single-network
  # design opened sockets to postgres:5432, minio:9000, and
  # keycloak:8080. It had no credentials for any of them, but "needs a
  # password" is a weaker property than "cannot open the socket", and
  # only one of the two survives a protocol-level CVE in one of those
  # services.
  #
  # Deliberately NOT `internal: true`. A script legitimately needs the
  # public internet: the case this feature exists for is refreshing a
  # layer from a county REST endpoint. Cutting off egress would remove
  # the reason to have it.
  #
  # Pinned subnet so the executor can hold a STATIC address (see
  # script-executor.networks). The egress fence targets the executor's
  # IP; when that IP was dynamic, every recreate handed it a fresh
  # address the fence did not yet cover, reopening the metadata/host
  # holes for up to a fence-timer interval. A fixed IP means the rules
  # are written once and never go stale. IPv4-only on purpose: the fence
  # is iptables, and enabling IPv6 here without ip6tables mirrors would
  # be an unfenced path.
  gg-script-net:
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
