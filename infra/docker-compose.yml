name: gratis-gis

services:
  postgres:
    build:
      # Same context as the production file. The Dockerfile copies
      # init-prod-db.sql and init-prod-db.sh, which live in infra/,
      # not in infra/postgres/.
      context: .
      dockerfile: postgres/Dockerfile
    image: gratis-gis-postgres:local
    container_name: gratis-gis-postgres
    restart: unless-stopped
    # pg_partman's own background worker schedules
    # partman.run_maintenance() so future observation partitions
    # keep getting created. Before this, NOTHING ran maintenance;
    # the partition-cutover migration papered over that with
    # premake=24 (two years of pre-created empty partitions, which
    # every non-tx_time-pruned query then had to probe). The
    # premake-tuning migration drops premake to 4, so this worker
    # is now load-bearing: without it, inserts start landing in the
    # DEFAULT partition once the premade months run out. Hourly
    # interval is generous for MONTHLY partitions and costs one
    # cheap catalog check per run.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_partman_bgw
      - -c
      - pg_partman_bgw.interval=3600
      - -c
      - pg_partman_bgw.role=gratisgis
      - -c
      - pg_partman_bgw.dbname=gratisgis
    environment:
      POSTGRES_DB: gratisgis
      POSTGRES_USER: gratisgis
      POSTGRES_PASSWORD: devpassword
      # The image's first-boot script exits if this is empty. Dev
      # Keycloak uses its own file database; this only lets init finish
      # so `compose up --wait` does not see the container die.
      KEYCLOAK_DB_PASSWORD: devpassword
    # Dev-only ports are bound to loopback. The passwords in this file
    # are fixed, so they must not be reachable from the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Keep PG17 volume layout (/data). PG18 (#306) needs dump/restore
      # before flipping this mount to /var/lib/postgresql.
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gratisgis -d gratisgis"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: gratis-gis-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_ADMIN_URL: http://localhost:8080
      KC_HTTP_ENABLED: "true"
      # dev-file keeps data in a local H2 file that survives container restarts
      # AND stays alive when the connection pool idles. dev-mem loses everything
      # the moment the JDBC pool drains a connection, which in Keycloak 26 can
      # happen within minutes of idle.
      KC_DB: dev-file
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/realm-gratis-gis.json:/opt/keycloak/data/import/realm-gratis-gis.json:ro
      # Custom login / account theme. Mounted under /opt/keycloak/themes
      # so Keycloak autoloads it; the realm references it by name via
      # loginTheme: "portal" (see realm-gratis-gis.json).
      - ./keycloak/themes/portal:/opt/keycloak/themes/portal:ro

  minio:
    # minio/minio was removed from Docker Hub (2026-09) and Quay
    # anonymous pulls return 401. Silo is a maintained MinIO fork that
    # keeps the same S3 API, MINIO_* env vars, /minio/* health routes,
    # and on-disk format — a drop-in for local infra. Pin tag + digest.
    # See https://github.com/palavido-dev/gratis-gis/issues/243
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    container_name: gratis-gis-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gratisgis
      MINIO_ROOT_PASSWORD: devpassword
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # Web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  pg_tileserv:
    image: pramsey/pg_tileserv:latest
    container_name: gratis-gis-pg_tileserv
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gratisgis:devpassword@postgres:5432/gratisgis
    ports:
      - "127.0.0.1:7800:7800"

  # Self-hosted geocoder. Defaults to the full OSM planet so the stack
  # is production-ready as-deployed; see infra/NOMINATIM.md for what
  # that commitment actually costs (time, disk, RAM) and how to dial
  # back to a country/state/city extract for smaller deployments.
  #
  # On first boot the container downloads NOMINATIM_PBF_URL and builds
  # its own Postgres database inside the container volume. Subsequent
  # boots skip the import. REPLICATION_URL lets Nominatim pull diffs
  # so the data stays current without re-importing.
  #
  # Env var matrix for common scenarios:
  #
  #   Dev spike (Monaco, ~1 MB, minutes to import):
  #     NOMINATIM_PBF_URL=https://download.geofabrik.de/europe/monaco-latest.osm.pbf
  #     NOMINATIM_REPLICATION_URL=https://download.geofabrik.de/europe/monaco-updates/
  #     NOMINATIM_SHM_SIZE=1gb
  #
  #   Regional (North America, ~13 GB, ~12 hr import on an SSD):
  #     NOMINATIM_PBF_URL=https://download.geofabrik.de/north-america-latest.osm.pbf
  #     NOMINATIM_REPLICATION_URL=https://download.geofabrik.de/north-america-updates/
  #     NOMINATIM_SHM_SIZE=8gb
  #
  #   Planet: an ~80 GB download that imports into a 1.1-1.3 TB
  #     database over 36-72 hours. See NOMINATIM.md for the hardware
  #     baseline.
  #
  # The default is Monaco. This is the dev stack, and `pnpm infra:up`
  # starts it: a planet default filled a new contributor's disk.
  nominatim:
    image: mediagis/nominatim:4.5
    container_name: gratis-gis-nominatim
    restart: unless-stopped
    environment:
      PBF_URL: ${NOMINATIM_PBF_URL:-https://download.geofabrik.de/europe/monaco-latest.osm.pbf}
      REPLICATION_URL: ${NOMINATIM_REPLICATION_URL:-https://download.geofabrik.de/europe/monaco-updates/}
      # Wikipedia ranking data significantly improves planet-level
      # result quality and costs ~20 GB to import. Off by default (the
      # Monaco extract); flip to true in your .env for a planet import.
      IMPORT_WIKIPEDIA: ${NOMINATIM_IMPORT_WIKIPEDIA:-false}
      # Freeze drops the tables updates need, which shrinks the disk
      # footprint by about 30 % but stops REPLICATION_URL from ever
      # applying a diff. Off by default because replication is on by
      # default. Set it to true only together with an empty
      # NOMINATIM_REPLICATION_URL, for a geocoder you never update.
      FREEZE: ${NOMINATIM_FREEZE:-false}
      NOMINATIM_PASSWORD: devpassword
      THREADS: ${NOMINATIM_THREADS:-8}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - nominatim-data:/var/lib/postgresql/16/main
      - nominatim-flatnode:/nominatim/flatnode
    # shm backs Postgres's parallel work. The default 64 MB is nowhere
    # near enough for a planet import: Postgres will OOM partway
    # through. 16 GB is a safe floor; 32 GB lets more of the import
    # run in parallel and finishes faster. Raise it with
    # NOMINATIM_SHM_SIZE when you import more than the Monaco default.
    shm_size: ${NOMINATIM_SHM_SIZE:-1gb}

volumes:
  pgdata:
  miniodata:
  nominatim-data:
  nominatim-flatnode:
