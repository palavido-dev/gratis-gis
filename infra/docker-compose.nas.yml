            db_pass = secret["POSTGRES_PASSWORD"]
            kc_db = secret["KEYCLOAK_DB_PASSWORD"]
            minio_pass = secret["MINIO_ROOT_PASSWORD"]
            token = secret["CHROMIUM_TOKEN"]
            email = os.environ.get("GRATIS_ACME_EMAIL", "").strip() or "admin@gratis.lan"
            relative = "/auth" if urls["mode"] == "lan" else ""
            internal_auth = "http://keycloak:8080" + relative
            values = {
                "GRATIS_MODE": urls["mode"],
                "GRATIS_TLS": urls.get("tls") or "",
                "PUBLIC_URL": public,
                "NEXTAUTH_URL": public,
                "NEXTAUTH_SECRET": secret["NEXTAUTH_SECRET"],
                "KEYCLOAK_URL": auth,
                "KEYCLOAK_INTERNAL_URL": internal_auth,
                "KEYCLOAK_REALM": "gratis-gis",
                "KEYCLOAK_ISSUER": f"{auth}/realms/gratis-gis",
                "KEYCLOAK_CLIENT_ID_WEB": "portal-web",
                "KEYCLOAK_CLIENT_SECRET_WEB": "",
                "KEYCLOAK_ADMIN_CLIENT_ID": "portal-api-admin",
                "KEYCLOAK_ADMIN_CLIENT_SECRET": secret["KEYCLOAK_ADMIN_CLIENT_SECRET"],
                "KEYCLOAK_ADMIN": "admin",
                "KEYCLOAK_ADMIN_PASSWORD": secret["KEYCLOAK_ADMIN_PASSWORD"],
                "POSTGRES_DB": "gratisgis",
                "POSTGRES_USER": "gratisgis",
                "POSTGRES_PASSWORD": db_pass,
                "KEYCLOAK_DB_PASSWORD": kc_db,
                "DATABASE_URL": f"postgresql://gratisgis:{db_pass}@postgres:5432/gratisgis",
                "KC_DB": "postgres",
                "KC_DB_URL": "jdbc:postgresql://postgres:5432/keycloak",
                "KC_DB_USERNAME": "keycloak",
                "KC_DB_PASSWORD": kc_db,
                # LAN: hostname is the site origin; /auth is the relative path.
                # Public: Keycloak has its own hostname and no path prefix.
                "KC_HOSTNAME": origin if urls["mode"] == "lan" else auth,
                "KC_HTTP_ENABLED": "true",
                "KC_HOSTNAME_STRICT": "false",
                "KC_PROXY_HEADERS": "xforwarded",
                "KC_BOOTSTRAP_ADMIN_USERNAME": "admin",
                "KC_BOOTSTRAP_ADMIN_PASSWORD": secret["KEYCLOAK_ADMIN_PASSWORD"],
                "KC_HEALTH_ENABLED": "true",
                "MINIO_ROOT_USER": "gratisgis",
                "MINIO_ROOT_PASSWORD": minio_pass,
                # Browser uploads hit the upload port from the web port.
                # Silo reads this when the NAS service sources /boot/env.
                "MINIO_API_CORS_ALLOW_ORIGIN": public,
                "MINIO_ENDPOINT": "http://minio:9000",
                "MINIO_PUBLIC_BASE": s3,
                "MINIO_ACCESS_KEY": "gratisgis",
                "MINIO_SECRET_KEY": minio_pass,
                "MINIO_BUCKET": "gratisgis",
                "S3_BUCKET": "gratisgis",
                # The point-cloud worker reads these four names. They match
                # the portal's own MinIO settings above.
                "ANALYSIS_TIERS": "server-heavy" if analysis_enabled() else "",
                "BACKUP_DIR": "/app/backups",
                "STORAGE_ALLOWED_ORIGINS": public,
                "CREDENTIAL_ENCRYPTION_KEY": secret["CREDENTIAL_ENCRYPTION_KEY"],
                "INITIAL_USER_PASSWORD": secret["INITIAL_USER_PASSWORD"],
                "DEFAULT_ORG_SLUG": "gratis-gis",
                "ACME_EMAIL": email,
                "CHROMIUM_TOKEN": token,
                "CHROMIUM_WS_ENDPOINTS": f"ws://chromium:3000?token={token}",
                "PORTAL_API_URL": "http://portal-api:4000",
                # Links in notification and feedback email. The code default
                # is http://localhost:3000.
                "PORTAL_BASE_URL": public,
                "NEXT_PUBLIC_API_URL": public,
                "NODE_ENV": "production",
                "PORT": "4000",
                # The image bakes GG_VERSION and GIT_SHA. Do not override them
                # with the pull tag. GG_CHANNEL is the update track.
                "GG_CHANNEL": image_channel(),
                "GRATIS_COMPOSE_REV": os.environ.get("GRATIS_COMPOSE_REV", "1").strip() or "1",
                "INSTALL_TYPE": "nas",
                "UPDATE_CHECK": os.environ.get("UPDATE_CHECK", "on").strip() or "on",
            }
            if relative:
                values["KC_HTTP_RELATIVE_PATH"] = relative
            secret_keys = (
                "POSTGRES_PASSWORD",
                "KEYCLOAK_DB_PASSWORD",
                "MINIO_ROOT_PASSWORD",
                "MINIO_SECRET_KEY",
                "KEYCLOAK_ADMIN_PASSWORD",
                "KEYCLOAK_ADMIN_CLIENT_SECRET",
                "KC_BOOTSTRAP_ADMIN_PASSWORD",
                "NEXTAUTH_SECRET",
                "CHROMIUM_TOKEN",
                "INITIAL_USER_PASSWORD",
                "CREDENTIAL_ENCRYPTION_KEY",
            )
            for key in secret_keys:
                if values[key] in WEAK or (key != "CREDENTIAL_ENCRYPTION_KEY" and len(values[key]) < 16):
                    raise SystemExit(f"refusing weak value for {key}")
            return values


        def ensure_org_attributes(schema: dict) -> bool:
            attributes = schema.setdefault("attributes", [])
            names = {item.get("name") for item in attributes if isinstance(item, dict)}
            changed = False
            specs = [
                ("org", "Organization"),
                ("org_role", "Org role"),
            ]
            for name, label in specs:
                if name in names:
                    continue
                attributes.append(
                    {
                        "name": name,
                        "displayName": label,
                        "permissions": {"view": ["admin", "user"], "edit": ["admin"]},
                        "multivalued": False,
                    }
                )
                changed = True
            return changed


        def _request(url: str, method: str, body: bytes | None, headers: dict[str, str]) -> tuple[int, bytes]:
            req = urllib.request.Request(url, data=body, headers=headers, method=method)
            try:
                with urllib.request.urlopen(req, timeout=20) as resp:
                    return resp.status, resp.read()
            except urllib.error.HTTPError as exc:
                return exc.code, exc.read()


        def grant_service_account_roles(internal: str, auth: dict[str, str]) -> None:
            """Give portal-api-admin the roles the Users page and sign-in settings need.

            Realm import grants them on a first boot. An install that already
            imported the realm, including one that is only restarted, does not
            import again, so this runs on every start and is safe to repeat.
            """
            status, raw = _request(
                f"{internal}/admin/realms/gratis-gis/clients?clientId=realm-management",
                "GET",
                None,
                auth,
            )
            if status != 200:
                print(f"WARN: could not find realm-management (HTTP {status}).")
                return
            found = json.loads(raw)
            if not found:
                print("WARN: realm-management client is missing.")
                return
            realm_mgmt = found[0]["id"]
            roles = []
            for name in ADMIN_CLIENT_ROLES:
                status, raw = _request(
                    f"{internal}/admin/realms/gratis-gis/clients/{realm_mgmt}/roles/{name}",
                    "GET",
                    None,
                    auth,
                )
                if status != 200:
                    print(f"WARN: realm-management role {name} is missing (HTTP {status}).")
                    continue
                role = json.loads(raw)
                roles.append({"id": role["id"], "name": role["name"]})
            if not roles:
                return
            status, raw = _request(
                f"{internal}/admin/realms/gratis-gis/clients?clientId=portal-api-admin",
                "GET",
                None,
                auth,
            )
            clients = json.loads(raw) if status == 200 else []
            if not clients:
                print(f"WARN: portal-api-admin client is missing (HTTP {status}).")
                return
            status, raw = _request(
                f"{internal}/admin/realms/gratis-gis/clients/{clients[0]['id']}/service-account-user",
                "GET",
                None,
                auth,
            )
            if status != 200:
                print(f"WARN: could not read the admin service account (HTTP {status}).")
                return
            sa_id = json.loads(raw)["id"]
            status, _ = _request(
                f"{internal}/admin/realms/gratis-gis/users/{sa_id}/role-mappings/clients/{realm_mgmt}",
                "POST",
                json.dumps(roles).encode(),
                {**auth, "Content-Type": "application/json"},
            )
            if status not in (200, 204):
                print(f"WARN: could not grant realm-management roles (HTTP {status}).", flush=True)
                return
            print("Keycloak admin service account can list and manage users.", flush=True)


        def ensure_default_offline_access(internal: str, auth: dict[str, str]) -> None:
            """Make offline_access part of the realm's default role.

            The realm names `viewer` as its default role, and viewer does not
            carry offline_access. Every user created after the import then
            failed field-app and QGIS sign-in with "Offline tokens not allowed
            for the user or client". A composite on the default role covers
            every user who holds it. Runs on every start and is safe to repeat.
            """
            base = f"{internal}/admin/realms/gratis-gis"
            status, raw = _request(base, "GET", None, auth)
            if status != 200:
                print(f"WARN: could not read the gratis-gis realm (HTTP {status}).")
                return
            default_role = (json.loads(raw).get("defaultRole") or {}).get("id")
            if not default_role:
                print("WARN: the gratis-gis realm has no default role.")
                return
            status, raw = _request(f"{base}/roles-by-id/{default_role}/composites/realm", "GET", None, auth)
            if status != 200:
                print(f"WARN: could not read the default role (HTTP {status}).")
                return
            if any(role.get("name") == "offline_access" for role in json.loads(raw)):
                return
            status, raw = _request(f"{base}/roles/offline_access", "GET", None, auth)
            if status != 200:
                print(f"WARN: the offline_access role is missing (HTTP {status}).")
                return
            role = json.loads(raw)
            status, _ = _request(
                f"{base}/roles-by-id/{default_role}/composites",
                "POST",
                json.dumps([{"id": role["id"], "name": role["name"]}]).encode(),
                {**auth, "Content-Type": "application/json"},
            )
            if status not in (200, 204):
                print(f"WARN: could not add offline_access to the default role (HTTP {status}).")
                return
            print("New users can sign in to the field app and QGIS (offline_access).", flush=True)


        def sync_sign_in_address(internal: str, auth: dict[str, str], values: dict[str, str]) -> None:
            """Rewrite the imported realm when the public URL changes.

            `--import-realm` does not update a realm that already exists, so a
            later GRATIS_BASE_URL used to leave Keycloak sending browsers to
            the first LAN address unless the volumes were deleted.
            """
            origins = sign_in_origins(values)
            if not origins:
                return
            headers = {**auth, "Content-Type": "application/json"}
            status, raw = _request(f"{internal}/admin/realms/gratis-gis", "GET", None, auth)
            if status != 200:
                print(f"WARN: could not read the gratis-gis realm (HTTP {status}).")
                return
            realm = apply_sign_in_realm(json.loads(raw), values["KEYCLOAK_URL"], origins)
            status, _ = _request(
                f"{internal}/admin/realms/gratis-gis",
                "PUT",
                json.dumps(realm).encode(),
                headers,
            )
            if status not in (200, 204):
                print(f"WARN: could not update the realm sign-in address (HTTP {status}).")
                return
            status, raw = _request(
                f"{internal}/admin/realms/gratis-gis/clients?clientId=portal-web",
                "GET",
                None,
                auth,
            )
            clients = json.loads(raw) if status == 200 else []
            if not clients:
                print(f"WARN: portal-web client is missing (HTTP {status}).")
                return
            client = apply_sign_in_client(clients[0], origins)
            status, _ = _request(
                f"{internal}/admin/realms/gratis-gis/clients/{client['id']}",
                "PUT",
                json.dumps(client).encode(),
                headers,
            )
            if status not in (200, 204):
                print(f"WARN: could not update portal-web redirect URIs (HTTP {status}).")
                return
            print(f"Keycloak sign-in address is {origins[0]}.", flush=True)


        def patch_keycloak(values: dict[str, str]) -> None:
            internal = values["KEYCLOAK_INTERNAL_URL"].rstrip("/")
            # KC_HTTP_RELATIVE_PATH is /auth. Keycloak 26 serves health on the
            # management port under that same prefix, not at /health/ready.
            relative = (values.get("KC_HTTP_RELATIVE_PATH") or "").rstrip("/")
            if relative and not relative.startswith("/"):
                relative = "/" + relative
            health_url = f"http://keycloak:9000{relative}/health/ready"
            deadline = time.time() + 180
            ready = False
            while time.time() < deadline:
                try:
                    status, _ = _request(health_url, "GET", None, {})
                    if status == 200:
                        ready = True
                        break
                except (urllib.error.URLError, TimeoutError, OSError):
                    pass
                time.sleep(3)
            if not ready:
                print("WARN: Keycloak did not become ready. Sign-in may fail until the next restart.")
                return
            form = urllib.parse.urlencode(
                {
                    "client_id": "admin-cli",
                    "username": "admin",
                    "password": values["KEYCLOAK_ADMIN_PASSWORD"],
                    "grant_type": "password",
                }
            ).encode()
            status, raw = _request(
                f"{internal}/realms/master/protocol/openid-connect/token",
                "POST",
                form,
                {"Content-Type": "application/x-www-form-urlencoded"},
            )
            if status != 200:
                print(f"WARN: could not sign in to Keycloak admin API (HTTP {status}).")
                return
            token = json.loads(raw).get("access_token") or ""
            auth = {"Authorization": f"Bearer {token}", "Accept": "application/json"}
            grant_service_account_roles(internal, auth)
            ensure_default_offline_access(internal, auth)
            sync_sign_in_address(internal, auth, values)
            status, raw = _request(f"{internal}/admin/realms/gratis-gis/users/profile", "GET", None, auth)
            if status != 200:
                print(f"WARN: could not read the user-profile schema (HTTP {status}).")
                return
            schema = json.loads(raw)
            if ensure_org_attributes(schema):
                body = json.dumps(schema).encode()
                put_headers = {**auth, "Content-Type": "application/json"}
                status, _ = _request(
                    f"{internal}/admin/realms/gratis-gis/users/profile",
                    "PUT",
                    body,
                    put_headers,
                )
                if status not in (200, 204):
                    print(f"WARN: could not update the user-profile schema (HTTP {status}).")
                    return
                print("Keycloak user-profile schema now includes org and org_role.")
            # The realm import may have dropped those attributes. Put them back
            # on the admin user so the first sign-in has an org claim.
            status, raw = _request(
                f"{internal}/admin/realms/gratis-gis/users?username=admin&exact=true",
                "GET",
                None,
                auth,
            )
            if status != 200:
                return
            users = json.loads(raw)
            if not users:
                return
            user = users[0]
            attrs = user.get("attributes") or {}
            # Only when the import dropped them, as restore-golden.sh does. An
            # operator who demoted `admin` or moved it to another org must not
            # see that undone on every restart.
            if attrs.get("org"):
                return
            attrs["org"] = ["gratis-gis"]
            attrs["org_role"] = ["admin"]
            user["attributes"] = attrs
            _request(
                f"{internal}/admin/realms/gratis-gis/users/{user['id']}",
                "PUT",
                json.dumps(user).encode(),
                {**auth, "Content-Type": "application/json"},
            )


        def _url_port(url: str, default: str) -> str:
            parsed = urllib.parse.urlparse(url)
            if parsed.port:
                return str(parsed.port)
            return default


        def banner(values: dict[str, str], *, reveal_password: bool) -> str:
            http_port = _url_port(values["PUBLIC_URL"], "8080")
            s3_port = _url_port(values["MINIO_PUBLIC_BASE"], "8900")
            if reveal_password:
                password = (
                    f"Password:           {values['INITIAL_USER_PASSWORD']}\n"
                    "Keycloak will ask you to change this password.\n"
                    "This password is printed only on the first start. Copy it\n"
                    "now and change it at first sign-in, before you share this\n"
                    "log. Do not post it publicly.\n"
                )
            else:
                password = (
                    "The first-start admin password is not printed again.\n"
                    "Sign in with the password you chose. If you forgot it, reset\n"
                    "that user from the host. The steps are in docs/truenas.md\n"
                    "and infra/reset-portal-password.sh. Do not delete this app's\n"
                    "volumes to get a new password. That erases the database and\n"
                    "the uploaded files.\n"
                )
            return (
                "\n========== GratisGIS ==========\n"
                f"Open this address:  {values['PUBLIC_URL']}\n"
                "Sign-in uses this address. Another name, such as a Tailscale\n"
                "hostname, needs GRATIS_BASE_URL set to that name. Restart\n"
                "and keep the volumes. Keycloak is updated in place.\n"
                "User:               admin\n"
                f"{password}"
                "Uploads use:        "
                f"{values['MINIO_PUBLIC_BASE']}\n"
                f"Do not forward ports {http_port} or {s3_port} on your router.\n"
                "===============================\n"
            )


        def address_help(port: str) -> str:
            return (
                "\n========== GratisGIS ==========\n"
                "Could not find a LAN address that opens from another computer.\n"
                "Network addresses, broadcast addresses, and Docker or TrueNAS\n"
                "bridge addresses are skipped.\n"
                "\n"
                "Set GRATIS_BASE_URL in the compose file to the address you open\n"
                "in a browser, then start this app again. Example:\n"
                f"\n    GRATIS_BASE_URL: http://192.168.1.20:{port}\n"
                "\n"
                "When port 8080 is already in use, change GRATIS_HTTP_PORT at the\n"
                "top of the file and use that same port in GRATIS_BASE_URL.\n"
                "\n"
                "The first-start admin password is printed once, only when\n"
                "startup succeeds on an empty volume.\n"
                "Do not post it publicly.\n"
                "===============================\n"
            )


        def _pause_or_return() -> None:
            if os.environ.get("GRATIS_SKIP_PATCH") == "1":
                return
            os.execvp("sleep", ["sleep", "infinity"])


        def main() -> None:
            boot = boot_dir()
            boot.mkdir(parents=True, exist_ok=True)
            ready = boot / "ready"
            # Hold every other service until this process has an address.
            # A previous boot may have published a bridge address.
            if ready.exists():
                ready.unlink()
            env_path = boot / "env"
            previous = read_env(env_path) if env_path.exists() else None
            # The status page goes up first, so Caddy has something to show
            # from the very first second (see STATUS_PAGE_HTML).
            ensure_status_dir()
            write_status_page(boot)
            write_boot_status("setting-up" if previous is None else "starting")
            # An address chosen on the status page counts as GRATIS_BASE_URL.
            # A GRATIS_BASE_URL set in the compose file still wins.
            saved_address = boot / "base-url"
            if not os.environ.get("GRATIS_BASE_URL", "").strip() and saved_address.exists():
                os.environ["GRATIS_BASE_URL"] = saved_address.read_text(encoding="utf-8").strip()
            if previous:
                secret = {key: previous[key] for key in (
                    "POSTGRES_PASSWORD",
                    "KEYCLOAK_DB_PASSWORD",
                    "MINIO_ROOT_PASSWORD",
                    "KEYCLOAK_ADMIN_PASSWORD",
                    "KEYCLOAK_ADMIN_CLIENT_SECRET",
                    "NEXTAUTH_SECRET",
                    "CHROMIUM_TOKEN",
                    "INITIAL_USER_PASSWORD",
                    "CREDENTIAL_ENCRYPTION_KEY",
                )}
            else:
                secret = fresh_secrets()
            # An explicit GRATIS_BASE_URL always wins, including on a restart.
            # A stored network or bridge address does not.
            prior = None if os.environ.get("GRATIS_BASE_URL", "").strip() else previous
            try:
                urls = resolve_urls(prior)
            except NeedAddress as exc:
                if os.environ.get("GRATIS_SKIP_PATCH") == "1":
                    print(address_help(exc.port), flush=True)
                    return
                # Ask on the status page instead of in the compose file.
                chosen = ask_address_in_browser(exc.port)
                saved_address.write_text(chosen + "\n", encoding="utf-8")
                saved_address.chmod(0o644)
                os.environ["GRATIS_BASE_URL"] = chosen
                write_boot_status("setting-up" if previous is None else "starting")
                urls = resolve_urls(None)
            values = assemble(urls, secret)
            # First start only: let the person choose the admin password on the
            # status page instead of copying a random one out of a log.
            chosen_password = ""
            if previous is None and wants_setup_questions(values):
                chosen_password = ask_admin_password_in_browser()
                write_boot_status("setting-up")
            write_env(env_path, values)
            write_service_envs(boot, values)
            realm = build_realm(values)
            realm_path = boot / "realm-gratis-gis.json"
            realm_path.write_text(json.dumps(realm, indent=2) + "\n", encoding="utf-8")
            realm_path.chmod(0o644)
            if values["GRATIS_MODE"] == "public":
                host = urllib.parse.urlparse(values["PUBLIC_URL"]).hostname or ""
                auth_host = urllib.parse.urlparse(values["KEYCLOAK_URL"]).hostname or ""
                storage_host = urllib.parse.urlparse(values["MINIO_PUBLIC_BASE"]).hostname or ""
                caddy = caddy_public(host, auth_host, storage_host, values["ACME_EMAIL"])
            else:
                # Caddy always listens on 8080 inside the container. The
                # published host port is GRATIS_HTTP_PORT (mapped to 8080).
                caddy = caddy_lan(
                    "8080",
                    values.get("GRATIS_TLS") or "",
                    caddy_auth_hosts(sign_in_origins(values)),
                )
            caddy_path = boot / "Caddyfile"
            caddy_path.write_text(caddy, encoding="utf-8")
            caddy_path.chmod(0o644)
            first_boot = previous is None
            text = banner(values, reveal_password=first_boot and not chosen_password)
            if chosen_password:
                text += "Admin password: the one chosen on the setup page.\n"
            if previous and previous.get("PUBLIC_URL") not in (None, values["PUBLIC_URL"]):
                text += (
                    "WARN: the sign-in address changed after the first start.\n"
                    "WARN: Keycloak is updated in place. Keep the volumes.\n"
                    "WARN: Open the new address and sign in again.\n"
                )
            # Older installs wrote the admin password to LOGIN.txt on this
            # volume, which every container can read. Remove it. The password
            # is not written again.
            login_txt = boot / "LOGIN.txt"
            if login_txt.exists():
                login_txt.unlink()
            # ready is last so Keycloak and Silo never read a half-written boot.
            # It carries this boot's stamp: every service waits for a marker
            # that matches its own GRATIS_BOOT_STAMP, so a marker left by an
            # older version or other settings does not let it start early.
            # Written to a temp name and renamed so a reader never sees half.
            stamp = os.environ.get("GRATIS_BOOT_STAMP", "").strip() or "ok"
            tmp_ready = boot / "ready.tmp"
            tmp_ready.write_text(stamp + "\n", encoding="utf-8")
            os.replace(tmp_ready, ready)
            write_boot_status("ready")
            print(text, flush=True)
            if os.environ.get("GRATIS_SKIP_PATCH") == "1":
                return
            try:
                patch_keycloak(values)
            except Exception as exc:  # noqa: BLE001 - keep the stack up
                print(f"WARN: Keycloak setup did not finish: {exc}")
            if chosen_password:
                if set_admin_password(values, chosen_password):
                    print("The admin password chosen on the setup page is set.", flush=True)
                else:
                    # Fall back to the first-start password so nobody is locked out.
                    print(
                        "WARN: could not set the admin password chosen on the setup page.\n"
                        "WARN: Sign in with this first-start password instead:\n"
                        f"Password:           {values['INITIAL_USER_PASSWORD']}\n",
                        flush=True,
                    )
                chosen_password = ""
            # Stay up so TrueNAS shows this container as running and the
            # password remains in `docker logs`.
            _pause_or_return()


        def run() -> None:
            """main(), with any failure shown on the status page too."""
            try:
                main()
            except SystemExit as exc:
                if exc.code not in (None, 0):
                    write_boot_status("failed", detail=str(exc.code))
                raise
            except Exception as exc:  # noqa: BLE001 - shown, then re-raised
                write_boot_status("failed", detail=f"{type(exc).__name__}: {exc}")
                raise


        if __name__ == "__main__":
            run()
        END_NAS_INIT
    volumes:
      - boot:/boot
      - status:/status
      - chromium-env:/svc/chromium
      - pointcloud-env:/svc/pointcloud
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /boot/ready 2>/dev/null)\" = \"$$GRATIS_BOOT_STAMP\""]
      interval: 5s
      timeout: 3s
      retries: 20
      # Long on purpose (all services that wait for bootstrap): the first
      # start can wait for someone to click "Use this address" on the
      # status page, and an update can spend minutes rebuilding indexes.
      # Failed checks inside this window do not count, so Compose keeps
      # waiting instead of giving up and leaving services in "Created".
      # A healthy check ends it at once (start_interval), and a crash
      # still shows at once, as a restart.
      start_period: 24h
      start_interval: 3s
    networks:
      - gratis-net

  postgres:
    image: ghcr.io/palavido-dev/gratis-gis/postgres:${GG_IMAGE_TAG:-edge}
    pull_policy: always
    restart: unless-stopped
    shm_size: 512mb
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until [ "$$(cat /boot/ready 2>/dev/null)" = "$$GRATIS_BOOT_STAMP" ]; do sleep 1; done
        set -a
        . /boot/env
        set +a
        exec docker-entrypoint.sh postgres \
          -c shared_preload_libraries=pg_partman_bgw,pg_stat_statements \
          -c pg_partman_bgw.interval=3600 \
          -c pg_partman_bgw.role=gratisgis \
          -c pg_partman_bgw.dbname=gratisgis \
          -c shared_buffers=256MB \
          -c effective_cache_size=1GB \
          -c work_mem=16MB \
          -c maintenance_work_mem=256MB \
          -c jit=off
    environment:
      GRATIS_BOOT_STAMP: *GRATIS_BOOT_STAMP
    volumes:
      - boot:/boot:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gratisgis -d gratisgis"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 24h
      start_interval: 3s
    networks:
      - gratis-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until [ "$$(cat /boot/ready 2>/dev/null)" = "$$GRATIS_BOOT_STAMP" ]; do sleep 1; done
        set -a
        . /boot/env
        set +a
        exec /opt/keycloak/bin/kc.sh start --http-enabled=true --health-enabled=true --proxy-headers=xforwarded --import-realm
    environment:
      GRATIS_BOOT_STAMP: *GRATIS_BOOT_STAMP
      JAVA_OPTS_APPEND: "-Xms256m -Xmx768m"
    volumes:
      # /boot holds /boot/env and /boot/ready. The import directory
      # is the same volume so --import-realm still sees
      # realm-gratis-gis.json. Keycloak imports only *.json.
      - boot:/boot:ro
      - boot:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Port open is enough for Compose to proceed. The bootstrap
    # container waits for /health/ready before it touches the realm.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 24h
      start_interval: 3s
    networks:
      - gratis-net

  minio:
    # pgsty/silo ships /usr/bin/silo, not a `minio` binary. Starting
    # `minio` exits 127. The image also has no credentials of its own:
    # if the process starts before /boot/env exists it formats /data
    # as minioadmin. Wait, source the generated env, then exec silo.
    # Unset the image's *_FILE defaults so a missing relative file
    # cannot replace the generated password.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until [ "$$(cat /boot/ready 2>/dev/null)" = "$$GRATIS_BOOT_STAMP" ]; do sleep 1; done
        set -a
        . /boot/env
        set +a
        unset MINIO_ROOT_USER_FILE MINIO_ROOT_PASSWORD_FILE MINIO_ACCESS_KEY_FILE MINIO_SECRET_KEY_FILE MINIO_CONFIG_ENV_FILE
        exec /usr/bin/silo server /data --console-address ":9001"
    ports:
      # Browser uploads. The host port is GRATIS_S3_PORT at the top
      # of this file. 9000 stays the port inside the container.
      # Do not forward this on your router.
      - target: 9000
        published: *GRATIS_S3_PORT
        protocol: tcp
    environment:
      GRATIS_BOOT_STAMP: *GRATIS_BOOT_STAMP
    volumes:
      - boot:/boot:ro
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 24h
      start_interval: 3s
    networks:
      - gratis-net

  portal-api:
    image: ghcr.io/palavido-dev/gratis-gis/portal-api:${GG_IMAGE_TAG:-edge}
    # Runs as a non-root user and needs no Linux capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pull_policy: always
    restart: unless-stopped
    mem_limit: 1536m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until [ "$$(cat /boot/ready 2>/dev/null)" = "$$GRATIS_BOOT_STAMP" ]; do sleep 1; done
        set -a
        . /boot/env
        set +a
        exec /usr/bin/tini -- /usr/local/bin/docker-entrypoint.sh node dist/main.js
    environment:
      GRATIS_BOOT_STAMP: *GRATIS_BOOT_STAMP
      # Where startup progress goes for the status page Caddy shows
      # while the portal is starting or updating.
      GG_STATUS_FILE: /status/api.json
      NODE_OPTIONS: --max-old-space-size=1024
      # Empty keeps unpaged feature reads streaming; `required` refuses
      # them and points at the csv export.
      GRATIS_FEATURE_QUERY_PAGE: ${GRATIS_FEATURE_QUERY_PAGE:-}
      # Uploaded files wait here for the import worker. The worker
      # mounts the same volume at the same path. Without it, every
      # queued import fails with "Source file expired".
      STAGING_DIR: /var/lib/gg-staging
      # Optional settings. Empty means the default. In Dockge, set
      # them in the env box. See docs/truenas.md.
      # Email notifications are off unless this is true. Configure
      # SMTP on the admin Notifications page.
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-}
      PORTAL_NAME: ${PORTAL_NAME:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GRATIS_DISABLE_BACKUP_UI: ${GRATIS_DISABLE_BACKUP_UI:-}
      POSTGIS_LIVE_DENY_HOSTS: ${POSTGIS_LIVE_DENY_HOSTS:-}
      POSTGIS_LIVE_ALLOW_HOSTS: ${POSTGIS_LIVE_ALLOW_HOSTS:-}
      SMTP_ALLOW_PLAINTEXT_AUTH: ${SMTP_ALLOW_PLAINTEXT_AUTH:-}
      GEOPARQUET_EXPORT_CONCURRENCY: ${GEOPARQUET_EXPORT_CONCURRENCY:-}
      SEARCH_INDEX_BUILD_TIMEOUT_MS: ${SEARCH_INDEX_BUILD_TIMEOUT_MS:-}
      BACKUP_ALLOWED_DIRS: ${BACKUP_ALLOWED_DIRS:-}
      # Off-site backup copy (also settable on the Backup admin page).
      BACKUP_OFFSITE_ENABLED: ${BACKUP_OFFSITE_ENABLED:-}
      BACKUP_OFFSITE_ENDPOINT: ${BACKUP_OFFSITE_ENDPOINT:-}
      BACKUP_OFFSITE_REGION: ${BACKUP_OFFSITE_REGION:-}
      BACKUP_OFFSITE_BUCKET: ${BACKUP_OFFSITE_BUCKET:-}
      BACKUP_OFFSITE_PREFIX: ${BACKUP_OFFSITE_PREFIX:-}
      BACKUP_OFFSITE_PATH_STYLE: ${BACKUP_OFFSITE_PATH_STYLE:-}
      BACKUP_OFFSITE_ACCESS_KEY_ID: ${BACKUP_OFFSITE_ACCESS_KEY_ID:-}
      BACKUP_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_OFFSITE_SECRET_ACCESS_KEY:-}
      BACKUP_OFFSITE_SECRET_ACCESS_KEY_FILE: ${BACKUP_OFFSITE_SECRET_ACCESS_KEY_FILE:-}
      BACKUP_OFFSITE_PASSPHRASE: ${BACKUP_OFFSITE_PASSPHRASE:-}
      BACKUP_OFFSITE_PASSPHRASE_FILE: ${BACKUP_OFFSITE_PASSPHRASE_FILE:-}
      BACKUP_OFFSITE_RETENTION_DAYS: ${BACKUP_OFFSITE_RETENTION_DAYS:-}
      BACKUP_OFFSITE_ALERT_DAYS: ${BACKUP_OFFSITE_ALERT_DAYS:-}
      BACKUP_OFFSITE_MIRROR_THRESHOLD_GB: ${BACKUP_OFFSITE_MIRROR_THRESHOLD_GB:-}
      BACKUP_OFFSITE_ALLOW_HTTP: ${BACKUP_OFFSITE_ALLOW_HTTP:-}
      NOTIFICATIONS_MAX_QUEUED_HOURS: ${NOTIFICATIONS_MAX_QUEUED_HOURS:-}
      NOTIFY_ADDRESS_HOURLY_LIMIT: ${NOTIFY_ADDRESS_HOURLY_LIMIT:-}
      PORTAL_MASTER_ADMIN: ${PORTAL_MASTER_ADMIN:-}
      SCRIPT_RUN_KEEP: ${SCRIPT_RUN_KEEP:-}
      PORTAL_LOCK_ADMIN_TIER: ${PORTAL_LOCK_ADMIN_TIER:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      JWT_ALLOWED_AZP: ${JWT_ALLOWED_AZP:-}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-}
      GRATIS_OPERATOR_ORG_ID: ${GRATIS_OPERATOR_ORG_ID:-}
      GRATIS_ADMIN_AUDIT_RETENTION_DAYS: ${GRATIS_ADMIN_AUDIT_RETENTION_DAYS:-}
      RECYCLE_BIN_RETENTION_DAYS: ${RECYCLE_BIN_RETENTION_DAYS:-}
      NOTIFICATIONS_RETENTION_DAYS: ${NOTIFICATIONS_RETENTION_DAYS:-}
      ITEM_SNAPSHOT_TTL_DAYS: ${ITEM_SNAPSHOT_TTL_DAYS:-}
      ITEM_SNAPSHOT_CAP_PER_ITEM: ${ITEM_SNAPSHOT_CAP_PER_ITEM:-}
      HOUSEKEEPING_STALE_ITEM_DAYS: ${HOUSEKEEPING_STALE_ITEM_DAYS:-}
      HOUSEKEEPING_STALE_USER_DAYS: ${HOUSEKEEPING_STALE_USER_DAYS:-}
      HOUSEKEEPING_TOP_N: ${HOUSEKEEPING_TOP_N:-}
      HOUSEKEEPING_ORPHAN_UPLOAD_MIN_AGE_HOURS: ${HOUSEKEEPING_ORPHAN_UPLOAD_MIN_AGE_HOURS:-}
      HOUSEKEEPING_FIELD_QUEUE_STALE_DAYS: ${HOUSEKEEPING_FIELD_QUEUE_STALE_DAYS:-}
      HOUSEKEEPING_FIELD_QUEUE_AUTO_PRUNE_GRACE_DAYS: ${HOUSEKEEPING_FIELD_QUEUE_AUTO_PRUNE_GRACE_DAYS:-}
      PORTAL_BASEMAP_PMTILES_URL: ${PORTAL_BASEMAP_PMTILES_URL:-}
      NOMINATIM_URL: ${NOMINATIM_URL:-}
      # Vector tiles are also kept on disk, so maps load quickly after
      # a restart or an update. Set TILE_CACHE_DISK_MAX_BYTES=0 to turn
      # it off. The default cap is 1 GiB.
      TILE_CACHE_DIR: ${TILE_CACHE_DIR:-/var/cache/gg-tiles}
      TILE_CACHE_DISK_MAX_BYTES: ${TILE_CACHE_DISK_MAX_BYTES:-}
      TILE_CACHE_DISK_MAX_FILES: ${TILE_CACHE_DISK_MAX_FILES:-}
    volumes:
      - boot:/boot:ro
      # Startup progress for the status page (src/startup-status.ts).
      - status:/status
      # Admin backup archives. Recreating the container keeps them.
      - portal-api-backups:/app/backups
      - gg-staging:/var/lib/gg-staging
      - tile-cache:/var/cache/gg-tiles
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 6h
      start_interval: 3s
    networks:
      - gratis-net

  portal-worker:
    image: ghcr.io/palavido-dev/gratis-gis/portal-api:${GG_IMAGE_TAG:-edge}
    # Runs as a non-root user and needs no Linux capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pull_policy: always
    restart: unless-stopped
    mem_limit: *GRATIS_WORKER_MEMORY
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until [ "$$(cat /boot/ready 2>/dev/null)" = "$$GRATIS_BOOT_STAMP" ]; do sleep 1; done
        set -a
        . /boot/env
        set +a
        export SKIP_MIGRATE=true
        exec /usr/bin/tini -- /usr/local/bin/docker-entrypoint.sh node dist/worker.main.js
    environment:
      GRATIS_BOOT_STAMP: *GRATIS_BOOT_STAMP
      NODE_OPTIONS: --max-old-space-size=${GRATIS_WORKER_HEAP_MB:-3072}
      # Same path and volume as portal-api, so the worker can read
      # the files portal-api staged for import.
      STAGING_DIR: /var/lib/gg-staging
      # Crons run on portal-api. Without this the worker could win
      # the cron lock and portal-api's scheduled jobs would not run.
      ENABLE_CRONS: "false"
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-}
      PORTAL_NAME: ${PORTAL_NAME:-}
      NOMINATIM_URL: ${NOMINATIM_URL:-}
      PORTAL_BASEMAP_PMTILES_URL: ${PORTAL_BASEMAP_PMTILES_URL:-}
      # 06-5: search index builds run here now, queued by portal-api.
      SEARCH_INDEX_BUILD_TIMEOUT_MS: ${SEARCH_INDEX_BUILD_TIMEOUT_MS:-}
    volumes:
      - boot:/boot:ro
      - gg-staging:/var/lib/gg-staging
    depends_on:
      portal-api:
        condition: service_healthy
    healthcheck:
      # tini is pid 1. Look for the worker in /proc. $$ so Compose
      # leaves the regex dollar sign for node.
      test:
        - CMD
        - node
        - -e
        - 'const fs=require("fs"); const n="worker"+".main.js"; let ok=false; for (const p of fs.readdirSync("/proc")) { if (!/^[0-9]+$$/.test(p)) continue; try { if (fs.readFileSync("/proc/"+p+"/cmdline").includes(n)) ok=true; } catch (e) {} } process.exit(ok?0:1)'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 1h
      start_interval: 3s
    networks:
      - gratis-net

  # Lidar and terrain processing. GRATIS_ANALYSIS at the top of this
  # file is the switch. off leaves the container sleeping so the API
  # can answer 503 instead of queueing work nothing will run.
  pointcloud-worker:
    image: ghcr.io/palavido-dev/gratis-gis/pointcloud-worker:${GG_IMAGE_TAG:-edge}
    # Runs as a non-root user and needs no Linux capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pull_policy: always
    restart: unless-stopped
    mem_limit: 2560m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until [ -f /svc/env.pointcloud ]; do sleep 1; done
        # Only what runner.py reads. PDAL and GDAL parse uploaded
        # files here, so this process does not get Keycloak, NextAuth
        # or credential-encryption secrets, and the boot volume that
        # holds them is not mounted here.
        set -a
        . /svc/env.pointcloud
        set +a
        if [ "$$ANALYSIS_TIERS" != "server-heavy" ]; then exec sleep infinity; fi
        echo "pointcloud-worker starting"
        exec /usr/local/bin/_entrypoint.sh python /app/runner.py
    environment:
      SCRATCH_DIR: /scratch
      # GDAL network lockdown. The worker builds local VRTs and reads
      # /vsis3/. /vsicurl/ stays refused via the HTTP timeouts.
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      GDAL_HTTP_CONNECTTIMEOUT: "2"
      GDAL_HTTP_TIMEOUT: "5"
      CPL_VSIL_CURL_USE_HEAD: "NO"
    volumes:
      - pointcloud-env:/svc:ro
      - pointcloud-scratch:/scratch
    depends_on:
      portal-api:
        condition: service_healthy
    healthcheck:
      # runner.py while analysis is on, sleep infinity while it is off.
      # The needle is split so this check does not match its own command.
      test:
        - CMD
        - /opt/conda/bin/python
        - -c
        - |
          import os
          def line(p):
              try:
                  return open("/proc/"+p+"/cmdline","rb").read().replace(b"\0", b" ")
              except OSError:
                  return b""
          n=("runner"+"."+"py").encode()
          ok=False
          for p in os.listdir("/proc"):
              if not p.isdigit():
                  continue
              raw=line(p)
              if n in raw or (b"sleep" in raw and b"infinity" in raw):
                  ok=True
          raise SystemExit(0 if ok else 1)
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 1h
      start_interval: 3s
    networks:
      - gratis-net

  portal-web:
    image: ghcr.io/palavido-dev/gratis-gis/portal-web:${GG_IMAGE_TAG:-edge}
    # Runs as a non-root user and needs no Linux capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until [ "$$(cat /boot/ready 2>/dev/null)" = "$$GRATIS_BOOT_STAMP" ]; do sleep 1; done
        set -a
        . /boot/env
        set +a
        # /boot/env sets PORT for the API. This server listens on 3000,
        # which is where Caddy sends the web UI.
        export PORT=3000
        exec /usr/bin/tini -- node apps/portal-web/server.js
    environment:
      GRATIS_BOOT_STAMP: *GRATIS_BOOT_STAMP
      # Map address search. Empty NOMINATIM_URL sends searches to the
      # public nominatim.openstreetmap.org unless
      # NOMINATIM_PUBLIC_FALLBACK is 0.
      NOMINATIM_URL: ${NOMINATIM_URL:-}
      NOMINATIM_PUBLIC_FALLBACK: ${NOMINATIM_PUBLIC_FALLBACK:-}
      GRATIS_SESSION_MAX_AGE_SECONDS: ${GRATIS_SESSION_MAX_AGE_SECONDS:-}
      GRATIS_SESSION_IDLE_SECONDS: ${GRATIS_SESSION_IDLE_SECONDS:-}
    volumes:
      - boot:/boot:ro
    depends_on:
      portal-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 1h
      start_interval: 3s
    networks:
      - gratis-net

  chromium:
    image: ghcr.io/browserless/chromium:latest@sha256:bcad9a1c271ddb9d95f7de5981c68cb2fcc9fd1f07e8da07c4e5c9d1ef4fc099
    restart: unless-stopped
    mem_limit: 768m
    # Chrome's namespace sandbox needs SYS_ADMIN.
    cap_add:
      - SYS_ADMIN
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until [ -f /svc/env.chromium ]; do sleep 1; done
        # Only the print token. Chrome renders user-authored map
        # styles, so it does not get the database or storage secrets,
        # and the boot volume that holds them is not mounted here.
        set -a
        . /svc/env.chromium
        set +a
        export PORT=3000
        export TOKEN="$$CHROMIUM_TOKEN"
        if [ -f /usr/src/app/scripts/start.sh ]; then cd /usr/src/app && exec ./scripts/start.sh; fi
        if [ -f /usr/src/app/start.sh ]; then cd /usr/src/app && exec ./start.sh; fi
        echo "Chromium start script was not found. Printing will not work." >&2
        exec sleep infinity
    volumes:
      - chromium-env:/svc:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/3000'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 1h
      start_interval: 3s
    networks:
      - gratis-net

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    # Caddy starts first and on its own. Until bootstrap has finished,
    # it serves only the status page (and forwards the "use this
    # address" button to bootstrap), so the web address shows progress
    # from the first minute instead of nothing. After that it runs the
    # Caddyfile bootstrap wrote, which shows the same page whenever the
    # portal does not answer: during an update, or when a start fails.
    command:
      - |
        mkdir -p /tmp/gg
        cat > /tmp/gg/Caddyfile <<'END_STATUS_CADDY'
        {
        	auto_https off
        	admin off
        }
        :8080 {
        	header X-GG-Status 1
        	header Cache-Control no-store
        	handle /__gg_ping {
        		respond "ok" 200
        	}
        	handle_path /__gg_status/* {
        		root * /status
        		file_server
        	}
        	handle /__gg_setup/* {
        		reverse_proxy bootstrap:8099
        	}
        	@page file {
        		root /boot/status-page
        		try_files /index.html
        	}
        	handle @page {
        		root * /boot/status-page
        		rewrite * /index.html
        		file_server
        	}
        	handle {
        		respond "GratisGIS is starting. Refresh this page in a minute." 503
        	}
        }
        END_STATUS_CADDY
        if [ "$$(cat /boot/ready 2>/dev/null)" != "$$GRATIS_BOOT_STAMP" ]; then
          caddy run --config /tmp/gg/Caddyfile --adapter caddyfile &
          pid=$$!
          trap 'kill -TERM $$pid 2>/dev/null; wait $$pid; exit 0' TERM INT
          until [ "$$(cat /boot/ready 2>/dev/null)" = "$$GRATIS_BOOT_STAMP" ]; do sleep 1; done
          kill -TERM $$pid 2>/dev/null
          wait $$pid 2>/dev/null || true
          trap - TERM INT
        fi
        exec caddy run --config /boot/Caddyfile --adapter caddyfile
    ports:
      # Host port -> Caddy's port 8080 inside the container.
      # The host port is GRATIS_HTTP_PORT at the top of this file.
      # Not 80 or 443, so the TrueNAS web UI can stay where it is.
      # A public domain (GRATIS_MODE=public) needs 80 and 443 instead:
      #   - "80:80"
      #   - "443:443"
      # and you remove this published port. See docs/truenas.md.
      - target: 8080
        published: *GRATIS_HTTP_PORT
        protocol: tcp
    environment:
      GRATIS_BOOT_STAMP: *GRATIS_BOOT_STAMP
    volumes:
      - boot:/boot:ro
      - status:/status:ro
      - caddy-data:/data
    # No depends_on: Caddy must be up even when the portal cannot start,
    # so the status page can say why.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/__gg_ping"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks:
      - gratis-net

volumes:
  boot:
  # Startup progress for the status page: bootstrap.json and api.json.
  # Tiny, and rewritten at every start. Nothing to back up.
  status:
  # One reduced env file each (see nas-init.py SERVICE_ENV_DIRS).
  chromium-env:
  pointcloud-env:
  pgdata:
  miniodata:
  caddy-data:
  portal-api-backups:
  pointcloud-scratch:
  # Upload staging shared by portal-api and portal-worker. Files here
  # expire after an hour, so it holds nothing you need to back up.
  gg-staging:
  # Vector tile disk cache. Safe to delete; tiles are rebuilt on use.
  tile-cache:

networks:
  gratis-net:
    driver: bridge
