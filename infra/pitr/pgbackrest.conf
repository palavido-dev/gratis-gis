# pgBackRest settings for the opt-in continuous backup overlay
# (infra/docker-compose.pitr.yml). Mounted read-only at
# /etc/pgbackrest/pgbackrest.conf in the postgres container.
#
# No secrets here. The bucket, endpoint, region, access key and the
# encryption passphrase come from infra/.env.pitr as PGBACKREST_*
# environment variables (see infra/pitr/pitr.env.example).
# Design: docs/cloud/backup-design.md.

[global]
# Repository: S3-compatible bucket at a second provider (Backblaze B2
# for GratisGIS Cloud). Path style works with B2, MinIO and AWS, and
# with bucket names that contain dots.
repo1-type=s3
repo1-path=/pgbackrest
repo1-s3-uri-style=path

# Client-side encryption. Every file is encrypted before it leaves the
# server. The passphrase is PGBACKREST_REPO1_CIPHER_PASS.
repo1-cipher-type=aes-256-cbc

# Keep every backup needed to restore to any moment in the last 14
# days (D10). With weekly full backups this keeps two or three full
# sets. Differential backups are kept with their full backup.
repo1-retention-full-type=time
repo1-retention-full=14

# Fewer, larger objects in the bucket, and differential backups that
# copy only changed blocks.
repo1-bundle=y
repo1-block=y

compress-type=zst
compress-level=3

# Back up from the running server without waiting for a scheduled
# checkpoint.
start-fast=y

# WAL goes out in the background, two files at a time, so a bulk
# import does not wait on one upload per 16 MB file.
archive-async=y
spool-path=/var/spool/pgbackrest

# If the bucket cannot be reached for a long time, stop holding WAL
# once 8 GB is waiting, so the database disk does not fill and stop
# the portal. WAL dropped this way breaks the restore chain until the
# next full backup. pitr-status.sh alerts long before this point.
archive-push-queue-max=8GiB

# Logs go to the container's output (docker logs, journald for the
# timers). Only warnings are written to a file inside the container.
log-level-console=info
log-level-file=warn

[global:archive-push]
process-max=2

[global:archive-get]
process-max=2

[global:backup]
process-max=2

[global:restore]
process-max=2

[gratisgis]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-socket-path=/var/run/postgresql
# pg1-user is PGBACKREST_PG1_USER, set by the overlay from POSTGRES_USER.
# The official image creates that role as the superuser; there is no
# "postgres" role to fall back on.
