# Stricter than .semgrep.yml. Semgrep 1.183 matches this template
# pattern. It also matches Prisma $queryRaw tagged templates, and
# pattern-not-inside did not exclude those, so CI does not use it.
rules:
  - id: gratisgis-st-geomfromgeojson-template-fixture
    message: Untagged template interpolates into ST_GeomFromGeoJSON.
    severity: ERROR
    languages: [typescript, javascript]
    patterns:
      - pattern: '`...${$X}...`'
      - metavariable-regex:
          metavariable: $X
          regex: 'JSON\.stringify|geojson|GeoJSON'
