# Publish the images infra/docker-compose.nas.yml pulls.
#
# main  -> ghcr.io/palavido-dev/gratis-gis/<name>:edge and :sha-<12>
# vX.Y.Z (stable tags only) -> that tag, plus :latest
#
# linux/amd64 only. TrueNAS SCALE and the public demo are amd64, and
# a second architecture doubles an already long build.
#
# Pushing does not by itself finish the job. infra/ensure-ghcr-public.sh
# marks each package public and then requests an anonymous GHCR token
# plus the manifest for every required tag. A missing tag or a DENIED
# token fails the workflow. The first revision called `gh api` with a
# pre-encoded package name; gh encoded it again, every job went red,
# and script-runner (which needs those jobs) never ran.
#
# portal-web is built with the open-source landing section on and the
# public-testing banner off. NEXT_PUBLIC_PORTAL_URL is not baked, so
# SEO canonicals in the prebuilt web image stay on the code default.
# Sign-in URLs are runtime env (PUBLIC_URL, KEYCLOAK_URL), not bake-time.

#
# NAS installs pull `edge` on every restart, so nothing publishes
# until CI and Security have both passed on the exact commit. `edge`
# follows main through workflow_run: each of those two workflows
# finishing on a main push starts this one, and the gate job publishes
# only when both are green for that commit and it is still the tip of
# main. A tag or a manual run needs the same green runs, and a manual
# run is refused on any ref other than main or a release tag. If the
# commit's CI or Security run was cancelled, a tag or manual run
# re-runs it once and waits, instead of failing the release.

name: Publish images

on:
  workflow_run:
    workflows: ["CI", "Security"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One group per commit and kind of publish: the edge publish
# (workflow_run, or a manual run on main) and the release tag publish
# (tag push, or a manual run on a tag). GitHub keeps one pending run
# per group and cancels the older pending one, so with a single group
# a later workflow_run on the same commit silently cancelled a queued
# tag run, and :vX.Y.Z and :latest were never pushed. The two kinds
# still must not push side by side (on v1.3.0 GitHub then never
# created script-runner), so the gate makes the newer run wait for the
# older one (infra/publish-gate.sh).
concurrency:
  group: publish-images-${{ github.event.workflow_run.head_sha || github.sha }}-${{ startsWith(github.ref, 'refs/tags/') && 'tag' || 'edge' }}
  cancel-in-progress: false

jobs:
  gate:
    name: CI and Security passed
    runs-on: ubuntu-latest
    # A tag push waits up to an hour for CI and Security on its commit,
    # and any run may wait up to three hours for an older publish run
    # on the same commit (infra/publish-gate.sh).
    timeout-minutes: 250
    permissions:
      contents: read
      # write: a tag push re-runs a cancelled CI or Security run on its
      # commit (infra/publish-gate.sh).
      actions: write
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      sha: ${{ steps.check.outputs.sha }}
      ref_type: ${{ steps.check.outputs.ref_type }}
      ref_name: ${{ steps.check.outputs.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the commit's CI and Security runs
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: bash infra/publish-gate.sh

  build:
    name: Publish ${{ matrix.name }}
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: postgres
            file: infra/postgres/Dockerfile
            context: infra
            web: false
          - name: portal-api
            file: apps/portal-api/Dockerfile
            context: .
            web: false
          - name: portal-web
            file: apps/portal-web/Dockerfile
            context: .
            web: true
          - name: pointcloud-worker
            file: tools/pointcloud-worker/Dockerfile
            context: .
            web: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          # git describe --tags needs the tags, not a depth-1 checkout.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          REF_TYPE: ${{ needs.gate.outputs.ref_type }}
          REF_NAME: ${{ needs.gate.outputs.ref_name }}
        run: |
          set -euo pipefail
          owner_path="ghcr.io/${GITHUB_REPOSITORY_OWNER}/gratis-gis/${{ matrix.name }}"
          short="${SHA::12}"
          tags="${owner_path}:sha-${short}"
          if [ "${REF_TYPE}" = "tag" ]; then
            tags="${tags},${owner_path}:${REF_NAME},${owner_path}:latest"
          else
            tags="${tags},${owner_path}:edge"
          fi
          described="$(git describe --tags --always)"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "described=${described}" >> "$GITHUB_OUTPUT"
          echo "short=${short}" >> "$GITHUB_OUTPUT"

      # Every image gets GG_VERSION and GIT_SHA. REQUIRED_COMPOSE_REV is
      # not passed: each Dockerfile's ARG default applies, and
      # check-nas-compose.sh checks those defaults against the NAS file.
      # portal-web also inlines NEXT_PUBLIC_GG_VERSION. Other Dockerfiles
      # do not declare the NEXT_PUBLIC args; passing them would warn.
      # The public-testing banner stays off (that arg is unset).
      - name: Build args
        id: buildargs
        run: |
          {
            echo "build_args<<EOF"
            echo "GG_VERSION=${{ steps.tags.outputs.described }}"
            echo "GIT_SHA=${{ needs.gate.outputs.sha }}"
            if [ "${{ matrix.web }}" = "true" ]; then
              echo "NEXT_PUBLIC_PROJECT_LANDING=1"
              echo "NEXT_PUBLIC_GITHUB_REPO=${GITHUB_REPOSITORY}"
              echo "NEXT_PUBLIC_GG_VERSION=${{ steps.tags.outputs.described }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          # Attestations need id-token and are not required to pull
          # the image. Leave them off so this job stays packages:write.
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.gate.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          build-args: ${{ steps.buildargs.outputs.build_args }}

  script-runner:
    name: Publish script-runner
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          REF_TYPE: ${{ needs.gate.outputs.ref_type }}
          REF_NAME: ${{ needs.gate.outputs.ref_name }}
        run: |
          set -euo pipefail
          owner_path="ghcr.io/${GITHUB_REPOSITORY_OWNER}/gratis-gis/script-runner"
          short="${SHA::12}"
          base="ghcr.io/${GITHUB_REPOSITORY_OWNER}/gratis-gis/portal-api:sha-${short}"
          tags="${owner_path}:sha-${short}"
          if [ "${REF_TYPE}" = "tag" ]; then
            tags="${tags},${owner_path}:${REF_NAME},${owner_path}:latest"
          else
            tags="${tags},${owner_path}:edge"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "described=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/script-runner/Dockerfile
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            PORTAL_API_IMAGE=${{ steps.tags.outputs.base }}
            GG_VERSION=${{ steps.tags.outputs.described }}
            GIT_SHA=${{ needs.gate.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.gate.outputs.sha }}
          cache-from: type=gha,scope=script-runner
          cache-to: type=gha,scope=script-runner,mode=max

  # Runs even when script-runner failed or was skipped, as long as the
  # image builds were not cancelled. A missing or private package fails
  # here with the owner click-path, instead of only a red build job.
  ensure-public:
    name: Packages are public
    needs: [gate, build, script-runner]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Require anonymous pull of every image and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ needs.gate.outputs.sha }}
          REF_TYPE: ${{ needs.gate.outputs.ref_type }}
          REF_NAME: ${{ needs.gate.outputs.ref_name }}
        run: bash infra/ensure-ghcr-public.sh
