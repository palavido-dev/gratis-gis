# Tag and publish a release when its release pull request merges.
#
# A release is a `chore(release): X.Y.Z` pull request from a
# `release/vX.Y.Z` branch that bumps the root package.json and adds a
# `## [X.Y.Z]` CHANGELOG section. Merging it used to be only half the
# job: the annotated tag and the GitHub release were manual steps, and
# they slipped. v1.5.0 got a lightweight tag, and v1.6.0 merged with no
# tag at all, so `deploy.sh` could not resolve it and install.sh kept
# handing out v1.5.0.
#
# This job does the second half from the merge commit: it checks that
# the branch name, package.json and CHANGELOG agree, creates the
# annotated tag `GratisGIS vX.Y.Z`, creates the GitHub release with the
# CHANGELOG section as notes, and starts the image publish for the tag.
#
# That last step is explicit on purpose. A tag pushed with GITHUB_TOKEN
# does not trigger other workflows, so publish-images.yml's
# `push: tags` trigger never fires for a tag made here. A
# workflow_dispatch from GITHUB_TOKEN does run, and publish-images
# accepts a manual run on a release tag (it still waits for CI and
# Security on that commit).
#
# Only branches in this repository count. A fork can name its branch
# release/v9.9.9, and pull_request runs for a fork get a read-only
# token anyway, so the job skips them rather than fail.
#
# Re-running is safe: an existing tag on the merge commit is accepted
# and an existing release is left alone. A tag that already points at
# a different commit fails the job instead of being moved.

name: Release tag

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-tag-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and publish the release
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Tag, release and start the image publish
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_REF" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Branch $HEAD_REF is not release/vX.Y.Z; nothing to tag."
            exit 0
          fi
          version="${BASH_REMATCH[1]}"
          tag="v$version"

          pkg="$(node -p "require('./package.json').version")"
          if [[ "$pkg" != "$version" ]]; then
            echo "::error::$HEAD_REF merged but package.json says $pkg."
            exit 1
          fi

          awk -v head="## [$version]" '
            index($0, head) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for [$version]."
            exit 1
          fi

          # An annotated tag lists its own object, then the commit it
          # peels to as tag^{}; a lightweight tag lists only the commit.
          # The last line is the commit either way.
          existing="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" \
            | tail -n 1 | cut -f1)"
          if [[ -z "$existing" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$SHA" -m "GratisGIS $tag"
            git push origin "refs/tags/$tag"
            echo "Tagged $tag at $SHA."
          elif [[ "$existing" == "$SHA" ]]; then
            echo "$tag already points at $SHA."
          else
            echo "::error::$tag already exists at $existing, not at the merge commit $SHA."
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it."
          else
            gh release create "$tag" --verify-tag --title "GratisGIS $tag" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

          gh workflow run publish-images.yml --ref "$tag"
          echo "Started Publish images for $tag."
