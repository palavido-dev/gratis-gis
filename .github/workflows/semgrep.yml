name: Semgrep

on:
  pull_request:
  push:
    branches: [main]

# Read the code and nothing else, like every other workflow here.
permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.183.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Project rule fixtures
        run: sh infra/semgrep/run-fixtures.sh
      - name: Project rules only
        run: semgrep scan --config .semgrep.yml --error --metrics=off
