name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the verify job only reads the checkout. Without
# an explicit block the workflow inherits the repository default,
# which can be read-write.
permissions:
  contents: read

# A newer push to a pull request cancels the older run. A push to
# main gets a group per commit instead: publish-images.yml needs this
# workflow to pass on the exact release commit, and a shared group let
# the next merge cancel that run, so the release tag failed its gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Match what prod actually runs: infra/postgres/Dockerfile is
        # FROM postgis/postgis:17-3.5 (PG 17 + PostGIS 3.5), and the
        # portal-api image ships postgresql-client-17 to pair with
        # it. Testing migrations against 16-3.4 stopped representing
        # reality when prod upgraded on 2026-05-25.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: gratisgis
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: gratisgis_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gratisgis -d gratisgis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gratisgis:devpassword@localhost:5432/gratisgis_ci?schema=public

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # No `version:` here -- pnpm/action-setup reads the version
        # from the `packageManager` field in root package.json
        # (pnpm@9.12.0). Specifying both triggers ERR_PNPM_BAD_PM_VERSION
        # and the runner dies before a single step can run.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Keep in lockstep with .nvmrc (24) and engines.node in the
          # root package.json (>=24.9.0). The production
          # container images pin their own Node (see the app
          # Dockerfiles); this only has to match the developer
          # toolchain.
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @gratis-gis/portal-api db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The pg-backed suites (engine observation-log, search-index)
      # get their own database on the same PostGIS service so their
      # DDL (DROP TABLE observation CASCADE, scratch databases) can
      # never collide with anything using DATABASE_URL. The role in
      # the service container is the bootstrap superuser, so it can
      # CREATE DATABASE and the search-index suite can make its own
      # per-run scratch database from this one.
      - name: Create engine test database
        run: |
          PGPASSWORD=devpassword psql -h localhost -U gratisgis -d gratisgis_ci \
            -c 'CREATE DATABASE gg_engine_ci'

      - name: Test
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://gratisgis:devpassword@localhost:5432/gg_engine_ci
          # Fail the job if the pg suites would skip. describe.skip
          # reads as green in the summary; that is how the void-column
          # engine bug shipped (#215).
          REQUIRE_PG_SPECS: '1'
          # Same reasoning for the script-runner integration suite
          # (#221): it skips without an interpreter, and on the runner
          # there is always one. A skip here would quietly stop
          # checking that a spawned script cannot read the worker's
          # secrets, which is the security boundary of that feature.
          REQUIRE_PYTHON_SPECS: '1'

      - name: Build
        run: pnpm build

  spdx:
    name: SPDX license headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Header check only. It does not need Postgres, pnpm, or Node.
    # `pnpm check:spdx` is the same script without the fixture
    # self-test; CI runs the self-test so a checker that stops
    # noticing a missing header fails here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check SPDX headers
        run: bash scripts/check-spdx.sh --self-test

  dependabot-automerge-gate:
    name: Dependabot auto-merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The auto-merge workflow does not check out the pull request, so
    # this job is what actually runs the gate functions. It extracts
    # them from the workflow file and feeds fixture JSON. It does not
    # call the merge API.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gate logic
        run: bash scripts/dependabot-automerge-gate.test.sh

  pointcloud-units:
    name: Point-cloud worker unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # boto3 and psycopg2 are stubbed by the test file. numpy is not:
    # compute_zonal_stats_arrays imports it, and that test runs before
    # the lease assertions. PDAL and GDAL are not required here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install unit-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv /tmp/pc-units
          /tmp/pc-units/bin/pip install -r tools/pointcloud-worker/requirements-unit.txt

      - name: runner unit tests
        run: /tmp/pc-units/bin/python tools/pointcloud-worker/test_runner_units.py

  observation-guards:
    name: Append idempotency and analysis lease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: gratisgis
          POSTGRES_PASSWORD: reviewonly
          POSTGRES_DB: gratisgis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gratisgis -d gratisgis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install a Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Guard SQL
        env:
          PGHOST: localhost
          PGUSER: gratisgis
          PGDATABASE: gratisgis
          PGPASSWORD: reviewonly
        run: |
          bash infra/observation-append-guard.pg.test.sh
          bash infra/analysis-lease-guard.pg.test.sh

  recovery-scripts:
    name: Backup and password recovery scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Bash, Python and Node only. The scripts are exercised with a fake
    # docker on PATH. Nothing here contacts a registry or a volume.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Recovery helpers
        run: |
          python3 -m unittest infra/test_nas_init.py
          bash infra/script-net-firewall.test.sh
          python3 -m unittest infra/test_prod_config.py
          bash scripts/backup-help.test.sh
          bash scripts/reset-portal-password.test.sh
          bash scripts/restore-maintenance.test.sh
          bash scripts/script-net-firewall.test.sh

      # These had no caller in any workflow, so they could not fail.
      - name: Infra script tests
        run: |
          bash infra/recovery/recovery.test.sh
          sh infra/postgres/check-major.spec.sh
          bash scripts/check-prisma-drift.test.sh
          python3 -m unittest infra/test_dev_compose_bind.py
          node infra/origin-preflight.test.mjs
          node infra/field-bundle/read-recovery.test.mjs
          bash infra/publish-gate.test.sh
          bash infra/lib-deploy.test.sh

  recovery-integration:
    name: Keycloak reset and maintenance gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Schema gate on Postgres
        run: |
          docker run -d --name gg-pg-ci \
            -e POSTGRES_PASSWORD=reviewonly \
            -e POSTGRES_USER=gratisgis \
            -e POSTGRES_DB=gratisgis \
            postgis/postgis:17-3.5
          # The image runs its init scripts on a temporary server that
          # listens on the socket only, then restarts. pg_isready on the
          # socket can catch that temporary server, and a test command
          # then dies with it (exit 137). Wait for the init to finish and
          # for the real server on TCP.
          for _ in $(seq 1 60); do
            if docker logs gg-pg-ci 2>&1 | grep -q 'PostgreSQL init process complete' \
              && docker exec gg-pg-ci pg_isready -h 127.0.0.1 -U gratisgis; then
              break
            fi
            sleep 2
          done
          docker exec gg-pg-ci pg_isready -h 127.0.0.1 -U gratisgis
          PG_DOCKER=gg-pg-ci bash infra/restore-maintenance.pg.test.sh
          docker rm -f gg-pg-ci

      - name: Isolated Keycloak password reset
        run: bash infra/reset-portal-password.kc.test.sh

  # Playwright on every pull request. prod-smoke only runs against the
  # demo once a day, so nothing exercised a browser before merge. This
  # runs portal-web under `next dev` with the UX fixture on, no API
  # behind it, and the journeys in e2e/tests/ux-journeys.spec.ts.
  ux-journeys:
    name: Playwright UX journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build portal-web's workspace dependencies
        run: pnpm --filter "@gratis-gis/portal-web^..." run build

      - name: Install Playwright chromium
        run: pnpm -C e2e exec playwright install --with-deps chromium

      - name: Start portal-web with the UX fixture
        env:
          GRATIS_UX_FIXTURE: "1"
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-only-not-a-secret
        run: |
          (cd apps/portal-web && nohup pnpm dev > "$RUNNER_TEMP/next-dev.log" 2>&1 &)
          for _ in $(seq 1 90); do
            if curl -fsS -o /dev/null --max-time 60 http://localhost:3000/dev/ux-fixture; then
              exit 0
            fi
            sleep 2
          done
          tail -n 80 "$RUNNER_TEMP/next-dev.log"
          exit 1

      - name: Run the journeys
        run: pnpm -C e2e exec playwright test tests/ux-journeys.spec.ts

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ux-journeys-report
          path: e2e/test-results/
          retention-days: 7

  dev-smoke:
    name: Fresh-clone pnpm dev
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Why this job exists: discussion #238. Two separate bugs stopped
    # `pnpm dev` working on any fresh clone, and neither was visible
    # here, because nothing in CI ever ran the one command the README
    # tells a new contributor to run.
    #
    # The verify job stays green through both of them. It never spawns
    # a dev server, and its first turbo task populates packages/*/dist
    # as a side effect, which is exactly the pre-warmed state that hid
    # the second bug from every maintainer's working tree too.
    #
    # Keep this job dumb. It is not an integration test. It asserts one
    # thing: a clean checkout, following the documented quickstart,
    # gets portal-api and portal-web listening. Nothing here may run
    # `pnpm build` or any other turbo task first. That would recreate
    # the blind spot this job exists to close.

    # Deliberately no `services:` block. A stock postgis/postgis image
    # is not a substitute for ours: migration
    # 20260508081000_partition_observation_table needs pg_partman and
    # dies with 0A000 "extension pg_partman is not available" without
    # it. verify gets away with the stock image only because it never
    # applies the migration chain. The real image is built from
    # infra/postgres, so this job uses that, below. Keep this image.
    # The syncVersion spec's monthly partitions are a substitute for
    # machines without pg_partman, not proof this migration ran.
    # Asserting the partition invariant after migrate is still a
    # separate queued job.

    env:
      # Straight from .env.example, so the quickstart's own
      # DATABASE_URL is what gets exercised.
      DATABASE_URL: postgresql://gratisgis:devpassword@localhost:5432/gratisgis?schema=public

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create the per-app env files
        # The quickstart step verbatim, no rewriting. Keycloak and
        # MinIO keep their placeholder values because nothing this job
        # touches needs them: /health is @Public() and returns a
        # literal, and DATABASE_URL is the app's only boot-time env
        # throw.
        run: |
          cp .env.example apps/portal-api/.env
          cp .env.example apps/portal-web/.env

      - name: Start Postgres
        # Not `pnpm infra:up`: that also starts Nominatim, which
        # imports an OSM extract and has no business in a smoke test.
        # Same compose file and same service definition, one service.
        # That gets the pg_partman image, the pg_partman_bgw preload
        # and init-db.sql, which is what the migration chain needs.
        # Do not point this step at stock postgis/postgis.
        run: docker compose -f infra/docker-compose.yml up -d --wait postgres

      - name: Migrate and generate the client
        # NOT the quickstart's `db:migrate`, and that is a finding
        # rather than a shortcut. `db:migrate` is `prisma migrate dev`,
        # which reads the extensions init-db.sql creates (postgis,
        # postgis_topology, postgis_tiger_geocoder, fuzzystrmatch,
        # pg_trgm, pgcrypto, uuid-ossp) as drift against the migration
        # history, demands a reset of the public schema, and exits 130
        # with no TTY to confirm at. A human on a brand-new database
        # gets the same demand and has to accept a destructive reset to
        # get past step 4 of the README. Nothing documents that. It is
        # very likely the "(Resolved)" the reporter of #238 wrote next
        # to this step.
        #
        # Worth fixing properly, by declaring the extensions in the
        # migration history so a first run is clean. That is a separate
        # change from this job. Until then, deploy applies the same
        # migrations without the drift check, and db:generate does the
        # client generation `migrate dev` would have done. Without it,
        # portal-api's build dies on a few hundred "Property 'x' does
        # not exist on type 'PrismaService'".
        run: |
          pnpm --filter @gratis-gis/portal-api db:migrate:deploy
          pnpm --filter @gratis-gis/portal-api db:generate
          # Real pg_partman on the project image. The Jest spec's
          # monthly partitions are a substitute and do not prove this.
          bash infra/assert-partition-invariant.sh

      - name: Prisma schema matches the migrations
        # Migrations are hand-lifted from `prisma migrate diff`, so a
        # schema that drifts from them invites a migration that renames
        # foreign keys, drops defaults or drops foreign keys. The shadow
        # database lives on the same pg_partman image the migrations
        # need. Known differences are listed in
        # apps/portal-api/prisma/drift-baseline.sql.
        run: |
          docker compose -f infra/docker-compose.yml exec -T postgres \
            createdb -U gratisgis gratisgis_shadow
          SHADOW_DATABASE_URL=postgresql://gratisgis:devpassword@localhost:5432/gratisgis_shadow \
            bash scripts/check-prisma-drift.sh

      # db:seed is the quickstart's next line and is deliberately
      # skipped. It loads demo data; it is not needed for the servers
      # to listen, which is the only thing asserted below.

      - name: pnpm dev brings both servers up
        # Start and poll in one step so the background process stays in
        # this shell's lifetime, and so an early exit is caught as an
        # exit rather than as a timeout. Both failure modes from #238
        # kill the turbo process within seconds, so the exit check is
        # the one that actually fires; the timeout is the backstop for
        # a server that hangs instead of dying.
        run: |
          # GitHub runs `run:` blocks as `bash -e`. This loop is built
          # out of commands that are supposed to fail -- curl against a
          # port nothing is listening on yet -- so errexit has to go.
          # An `if` condition is exempt from -e but a plain assignment
          # is not, so `code=$(curl ...)` inherited curl's exit 7 on the
          # first refused connection and killed the step five seconds
          # in. Test this block with `bash -e`, not plain `bash`, or
          # that failure is invisible.
          set +e
          set -uo pipefail
          rm -f dev.log dev.exit
          # Record the exit status in a file rather than polling the pid.
          # A backgrounded child that has exited but not been reaped is a
          # zombie, and `kill -0` succeeds on a zombie, so a pid check
          # sails straight past the exact failure this job is here to
          # catch. Verified: with the #238 bug reintroduced, a kill -0
          # loop ran the full timeout and never noticed turbo had died.
          ( pnpm dev > dev.log 2>&1; echo $? > dev.exit ) &
          api=''
          web=''
          for _ in $(seq 1 90); do
            if [ -f dev.exit ]; then
              echo "::error::pnpm dev exited ($(cat dev.exit)) before both servers were up"
              tail -n 120 dev.log
              exit 1
            fi
            # A dev task can die while the others keep running, which
            # leaves the ports answering and the run silently failed.
            # That is the shape the bug had on a maintainer's machine,
            # where packages/*/dist was already warm: turbo did not tear
            # the run down, so "both ports answer" alone would call it
            # green. turbo prefixes each task's output, so a prefixed
            # ELIFECYCLE is a task that exited; an unprefixed one is
            # just the root script reacting to our own cleanup.
            if grep -qE '@gratis-gis/[a-z-]+:dev:.*ELIFECYCLE' dev.log 2>/dev/null; then
              echo '::error::a dev task exited while the rest of the run continued'
              tail -n 120 dev.log
              pkill -f 'turbo run dev' 2>/dev/null || true
              exit 1
            fi
            if [ -z "$api" ] && curl -fs -o /dev/null http://localhost:4000/health 2>/dev/null; then
              api=up
              echo 'portal-api is up'
            fi
            if [ -z "$web" ]; then
              # Any HTTP response proves the server is listening. Not -f:
              # an unauthenticated GET / redirects to Keycloak, which is
              # not running here, and the redirect itself is the proof.
              # curl prints 000 on a refused connection and exits non-zero,
              # so do not add a `|| echo 000` fallback: it appends a second
              # 000, the compared string stops equalling 000, and every
              # refused connection reads as a live server.
              code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ 2>/dev/null)
              if [ -n "$code" ] && [ "$code" != '000' ]; then
                web=up
                echo "portal-web is up (HTTP $code)"
              fi
            fi
            if [ -n "$api" ] && [ -n "$web" ]; then
              echo 'both servers up from a clean checkout'
              pkill -f 'turbo run dev' 2>/dev/null || true
              exit 0
            fi
            sleep 2
          done
          echo "::error::timed out waiting for portal-api (${api:-down}) and portal-web (${web:-down})"
          tail -n 200 dev.log
          pkill -f 'turbo run dev' 2>/dev/null || true
          exit 1

  android-client:
    name: Android client
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # clients/android is a Gradle project outside the pnpm workspace,
    # so `pnpm test` never sees it. Its unit tests run the real field
    # engine bundle inside QuickJS on the JVM, which is the host half of
    # the conformance gate in docs/mobile-field-app.md: the bundle is
    # built from this same checkout first, so a form-schema change that
    # breaks the Kotlin marshalling fails here, not on a phone.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the field engine bundle
        # The Android build copies dist/ from here; it never builds the
        # bundle itself (two toolchains producing one file is how they
        # drift).
        run: pnpm --filter @gratis-gis/field-engine build

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests and debug APK
        working-directory: clients/android
        # The runner image ships Temurin JDKs and the Android SDK;
        # AGP fetches the platform and build-tools it needs.
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest :app:assembleDebug

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-unit-test-reports
          path: clients/android/**/build/reports/tests/testDebugUnitTest/

  python-client:
    name: Python client
    # Pin 24.04: ubuntu-latest moved to 26.04, and actions/python-versions
    # does not ship 3.9 builds for that OS yet. Keep testing the
    # requires-python floor (>=3.9) rather than silently jumping to a
    # newer interpreter.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          # The floor declared in pyproject. Testing on the newest
          # interpreter only would let a 3.9-incompatible annotation
          # through and break exactly the users who are on an old
          # distro python, which is most of the ones running a script
          # on a server.
          python-version: '3.9'

      - name: Install
        working-directory: clients/python
        run: pip install -e '.[dev]'

      - name: Test
        working-directory: clients/python
        run: python -m pytest -q

      - name: Build the distributions
        working-directory: clients/python
        # Proves the package is publishable on every commit rather than
        # discovering it is not at tag time, and checks that the version
        # is still readable from src/gratisgis/client.py, which is where
        # hatch now reads it from.
        run: |
          pip install build twine
          python -m build
          twine check dist/*

  # Interpolates the prebuilt-image compose with a generated env and
  # the TrueNAS include wrapper. No image build and no image pull.
  # publish-images.yml is what makes the tags real; this job only
  # stops a compose edit from shipping a file that will not parse.
  nas-compose:
    name: NAS compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate NAS compose
        run: ./infra/check-nas-compose.sh

      # Every variable the apps read must reach them through Compose,
      # or be listed in infra/env-passthrough.allow with a reason.
      - name: Env passthrough
        run: |
          python3 infra/check-env-passthrough.py --self-test
          python3 infra/check-env-passthrough.py

  # Boots the pasted file against the published edge images. Catches
  # a Keycloak mount that never becomes healthy and a Silo process
  # that exits 127, which `compose config` cannot see.
  nas-boot:
    name: NAS compose boot
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: nas-compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Boot the NAS stack
        run: ./infra/boot-nas-ci.sh

      - name: Upload NAS boot logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nas-boot-logs
          path: ${{ runner.temp }}/nas-boot
          if-no-files-found: ignore
