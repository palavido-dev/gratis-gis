<?xml version="1.0" encoding="UTF-8"?>
<!--
  GratisGIS app icon: the contour G (a G drawn as two contour rings
  around a point) in warm paper on a teal tile. Same geometry as
  components/brand-mark.tsx, scaled from its 48-unit grid by 9.2 and
  centred. Keep in sync with brand-mark.tsx, app/opengraph-image.tsx,
  the Keycloak login logo and the Android launcher icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0b6e69"/>
  <g transform="translate(35.2 35.2) scale(9.2)" fill="none" stroke="#f4f2ec" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.6">
    <path d="M36.73 11.27A18 18 0 1 0 42 24H32"/>
    <path d="M32.49 15.51A12 12 0 1 0 36 24" opacity="0.6"/>
    <circle cx="24" cy="24" r="3.4" fill="#f4f2ec" stroke="none"/>
  </g>
</svg>
