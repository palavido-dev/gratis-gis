<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title">
  <title id="title">Map builder with a layer list and a styled point layer</title>
  <rect width="720" height="420" fill="#f6f7f9"/>
  <rect x="0" y="0" width="720" height="48" fill="#ffffff" stroke="#d7dde6"/>
  <text x="20" y="30" fill="#161d27" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Park benches</text>
  <rect x="0" y="48" width="200" height="372" fill="#ffffff" stroke="#d7dde6"/>
  <text x="16" y="78" fill="#5c6b7a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="650">LAYERS</text>
  <rect x="12" y="96" width="176" height="36" rx="6" fill="#e7eef6"/>
  <circle cx="32" cy="114" r="6" fill="#21466e"/>
  <text x="48" y="118" fill="#161d27" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Benches</text>
  <text x="16" y="160" fill="#21466e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">+ Add layer</text>
  <rect x="200" y="48" width="520" height="372" fill="#e7eef6"/>
  <path d="M240 220 C300 140, 380 260, 460 180 S620 240, 680 160" fill="none" stroke="#9dc0dd" stroke-width="8"/>
  <circle cx="360" cy="200" r="8" fill="#21466e" stroke="#ffffff" stroke-width="2"/>
  <circle cx="470" cy="250" r="8" fill="#21466e" stroke="#ffffff" stroke-width="2"/>
  <circle cx="560" cy="170" r="8" fill="#21466e" stroke="#ffffff" stroke-width="2"/>
  <rect x="520" y="340" width="180" height="60" rx="8" fill="#ffffff" stroke="#d7dde6"/>
  <text x="536" y="366" fill="#161d27" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Style</text>
  <text x="536" y="384" fill="#5c6b7a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Color, size, labels</text>
</svg>
