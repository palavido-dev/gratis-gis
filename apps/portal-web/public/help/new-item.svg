  <text x="280" y="190" fill="#5c6b7a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Features and fields</text>
  <rect x="456" y="128" width="176" height="88" rx="8" fill="#ffffff" stroke="#d7dde6"/>
  <text x="472" y="168" fill="#161d27" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Form</text>
  <text x="472" y="190" fill="#5c6b7a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Questions in the field</text>
  <rect x="72" y="236" width="560" height="44" rx="8" fill="#ffffff" stroke="#d7dde6"/>
  <text x="88" y="263" fill="#8b97a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Title</text>
  <rect x="488" y="308" width="144" height="40" rx="8" fill="#21466e"/>
  <text x="524" y="333" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Create</text>
